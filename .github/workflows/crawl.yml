name: Crawl a site

# Runs bin/crawl-site from GitHub's servers and commits the result to
# data/research/, where the site build and content planning can read it.
#   mode own        our own site: full text, for migration and redirects
#   mode structure  another site: titles, headings and structure only

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Start URL"
        required: true
      mode:
        type: choice
        options: [own, structure]
        default: structure
      max:
        description: "Maximum pages"
        default: "500"
      name:
        description: "Output file name, without .json"
        required: true

permissions:
  contents: write

concurrency:
  group: crawl-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl
        env:
          URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          MAX: ${{ inputs.max }}
          NAME: ${{ inputs.name }}
        run: |
          case "$NAME" in *[!a-z0-9-]*|"") echo "::error::name must be lowercase letters, digits and dashes"; exit 1;; esac
          bin/crawl-site "$URL" --mode "$MODE" --max "$MAX" --out "data/research/$NAME.json"

      - name: Save the result
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/research/$NAME.json"
          git diff --cached --quiet && exit 0
          git commit -m "Crawl data: $NAME"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1
