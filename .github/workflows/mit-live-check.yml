name: Move In Thailand live check

# Opens the live home page in Chromium (desktop and phone) and checks the scroll
# story, header and layout. Run it after a release; screenshots are kept as an artifact.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to check"
        default: "https://moveinthailand.com/"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Check the live page
        env:
          PAGE_URL: ${{ inputs.url }}
        run: python tools/mit_live_check.py "$PAGE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check-screenshots
          path: .cache/live-check/
          include-hidden-files: true
          retention-days: 7
