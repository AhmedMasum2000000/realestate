name: Second Home Thailand website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-home-thailand-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install site build dependencies
        run: pip install -r mit/requirements.txt
      - name: Compile the website
        run: |
          python sht/build.py
          node --check .cache/sht-build/assets/site.js
          node --check sht/assets/motion.js
          php -l sht/wordpress/sht-experience.php
      - name: Publish to the existing cPanel WordPress site
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python tools/mit_deploy.py --site sht --release "${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        with:
          name: second-home-thailand-release
          path: |
            .cache/sht-build/
            .cache/sht-deploy-report.json
          include-hidden-files: true
          retention-days: 14
