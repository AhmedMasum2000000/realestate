name: Audit a public page

# Read-only. Loads one public page in a real browser (desktop and phone), scrolls through it, and
# reports failed requests, script errors, broken images and sideways overflow. Full-page
# screenshots are printed into the log as base64 between SHOT-BEGIN and SHOT-END.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL, e.g. https://ledadpro.com/v2/"
        required: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm i -s playwright@1.48.2 sharp@0.33.5
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit
        env:
          URL: ${{ inputs.url }}
        run: |
          case "$URL" in https://*) ;; *) echo "URL must start with https://"; exit 1;; esac
          cat > audit.js <<'EOF'
          const { chromium, devices } = require('playwright');
          const sharp = require('sharp');
          (async () => {
            const b = await chromium.launch();
            for (const [name, opts] of [['desktop', { viewport: { width: 1440, height: 900 } }], ['phone', devices['iPhone 13']]]) {
              const ctx = await b.newContext(opts); const p = await ctx.newPage();
              const fails = [], errs = [];
              p.on('requestfailed', r => fails.push('FAILED ' + r.url() + ' ' + (r.failure() || {}).errorText));
              p.on('response', r => { if (r.status() >= 400) fails.push(r.status() + ' ' + r.url()); });
              p.on('pageerror', e => errs.push(e.message));
              p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text()); });
              await p.goto(process.env.URL, { waitUntil: 'networkidle', timeout: 60000 });
              const H = await p.evaluate(() => document.body.scrollHeight);
              for (let y = 0; y < H; y += 400) { await p.evaluate(y => scrollTo(0, y), y); await p.waitForTimeout(120); }
              await p.waitForTimeout(1500);
              const report = await p.evaluate(() => {
                const vw = innerWidth;
                const broken = [...document.images].filter(i => i.getAttribute('src') && (!i.complete || i.naturalWidth === 0)).map(i => i.getAttribute('src'));
                const wide = [...document.querySelectorAll('body *')].filter(e => {
                  const r = e.getBoundingClientRect(); if (r.width === 0 || r.right <= vw + 1) return false;
                  for (let a = e.parentElement; a && a !== document.body; a = a.parentElement) if (getComputedStyle(a).overflowX !== 'visible') return false;
                  return true;
                }).slice(0, 10).map(e => e.tagName + '.' + e.className + ' right=' + Math.round(e.getBoundingClientRect().right));
                const fontsOk = document.fonts.check('900 40px Archivo');
                return { scrollWidth: document.documentElement.scrollWidth, vw, broken, wide, fontsOk, height: document.body.scrollHeight };
              });
              console.log('=== ' + name, JSON.stringify(report, null, 1));
              console.log('requests:', fails.length ? '\n' + [...new Set(fails)].join('\n') : 'all ok');
              console.log('errors:', errs.length ? '\n' + errs.join('\n') : 'none');
              const png = await p.screenshot({ fullPage: true });
              const jpg = await sharp(png).resize({ width: name === 'desktop' ? 900 : 390 }).jpeg({ quality: 55 }).toBuffer();
              console.log('SHOT-BEGIN ' + name); console.log(jpg.toString('base64')); console.log('SHOT-END');
              await ctx.close();
            }
            await b.close();
          })();
          EOF
          node audit.js
