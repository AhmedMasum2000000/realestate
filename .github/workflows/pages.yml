name: Publish pattayahomepro preview

# Rebuilds the site from the committed data/catalog.json and publishes it to
# GitHub Pages. The source CSV is gitignored and never needed here — the whole
# point of committing the normalized snapshot is that CI can reproduce the
# build without it and without network access.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
#
# This publishes a PREVIEW: links are prefixed with the repository name
# (project Pages serve at /<repo>/) and robots.txt disallows everything so the
# preview cannot compete with the production domain in search.
# To cut over to production once DNS points at Pages, drop both flags from the
# build step — that restores root-relative links and writes the CNAME.

on:
  push:
    branches:
      - main
      - claude/domain-setup-automation-9inamq
    paths:
      - 'data/catalog.json'
      - 'data/enrichment.json'
      - 'src/rep/catalog/**'
      - 'templates/phpro/**'
      - 'assets/properties/**'
      - 'bin/build-site'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let an in-flight one finish rather than
# cancelling it, so Pages is not left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: bin/build-site public --base "${{ github.event.repository.name }}" --preview

      - name: Check every internal link resolves
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          out = Path("public")
          base = "/${{ github.event.repository.name }}"
          checked = broken = 0
          for f in out.rglob("index.html"):
              for href in re.findall(r'href="(/[^"]*)"', f.read_text(encoding="utf-8")):
                  h = href.split("#")[0].split("?")[0]
                  if not h or not h.startswith(base):
                      continue
                  rel = h[len(base):].strip("/")
                  checked += 1
                  p = out / "index.html" if not rel else (
                      out / rel if (out / rel).is_file() else out / rel / "index.html")
                  if not p.exists():
                      broken += 1
                      print(f"BROKEN {h} (from {f})")
          print(f"checked={checked} broken={broken}")
          sys.exit(1 if broken else 0)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
