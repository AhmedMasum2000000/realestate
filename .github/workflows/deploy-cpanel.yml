name: Deploy to cPanel

# Publishes pattayahomepro.com to your cPanel hosting.
#
# One-time setup — Settings -> Secrets and variables -> Actions -> New secret:
#   SSH_HOST        your server address, e.g. server123.web-hosting.com
#   SSH_USER        your cPanel username (not your email)
#   SSH_PRIVATE_KEY the full private key, BEGIN/END lines included
#   SSH_PORT        optional, defaults to 22
#   DEPLOY_DOCROOT  optional, defaults to public_html
#
# After that every push to main republishes the site. Nothing else to do.
# Run it by hand any time from the Actions tab -> Deploy to cPanel -> Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'data/catalog.json'
      - 'data/enrichment.json'
      - 'src/rep/catalog/**'
      - 'templates/phpro/**'
      - 'assets/**'
      - 'bin/build-site'
      - 'bin/check-site'
      - 'bin/deploy-cpanel'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

# One deploy at a time. An in-flight publish is allowed to finish rather than
# being cancelled half-written.
concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and verify
        run: |
          bin/build-site site
          bin/check-site site

      - name: Stop if the deploy secrets are missing
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Write the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Record the host key so the connection is not silently trusting
          # whatever happens to answer.
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Publish
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY_PATH: /home/runner/.ssh/deploy_key
          DEPLOY_DOCROOT: ${{ secrets.DEPLOY_DOCROOT }}
        run: bin/deploy-cpanel --apply

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
