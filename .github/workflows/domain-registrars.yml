name: Domain registrars (read-only)

# Public RDAP lookup: who each domain is registered with, when it expires and its nameservers.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Look up
        run: |
          echo "| Domain | Registrar | Expires | Nameservers |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for d in pattayahomespro.com pattayahomepro.com moveinthailand.com secondhomethailand.com thaihomespro.com microgigger.com; do
            curl -s -L -m 30 "https://rdap.org/domain/$d" | python3 -c "
          import sys,json
          j=json.load(sys.stdin)
          reg=[e for e in j.get('entities',[]) if 'registrar' in e.get('roles',[])]
          name=reg[0]['vcardArray'][1][1][3] if reg else '?'
          ev={e['eventAction']:e['eventDate'][:10] for e in j.get('events',[])}
          ns=', '.join(n['ldhName'].lower() for n in j.get('nameservers',[]))
          print(f'| $d | {name} | {ev.get(\"expiration\")} | {ns} |')" | tee -a "$GITHUB_STEP_SUMMARY"
          done
