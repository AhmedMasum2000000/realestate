name: Migrate Namecheap cPanel backup to VPS

# Step 1 of the move: cPanel builds a full backup (files, databases, email) of the Namecheap
# account and sends it to the VPS. Nothing on the old hosting changes; nothing on the VPS is
# touched except the new folder /root/migration/namecheap.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      VPS: 187.127.141.173
      DEST: /root/migration/namecheap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Prepare the folder on the VPS
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new root@$VPS "mkdir -p $DEST && chmod 700 /root/migration && ls -la $DEST"
      - name: Ask cPanel for the backup
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: bin/migrate-namecheap-backup $VPS $DEST
      - name: Wait for it to arrive
        run: |
          set -o pipefail
          last=""
          for i in $(seq 1 70); do
            sleep 60
            now=$(sshpass -e ssh root@$VPS "ls -l $DEST/*.tar.gz 2>/dev/null | awk '{print \$5, \$9}'" || true)
            echo "$(date +%H:%M) ${now:-nothing yet}"
            if [ -n "$now" ] && [ "$now" = "$last" ]; then
              echo "Backup complete:" | tee -a "$GITHUB_STEP_SUMMARY"
              sshpass -e ssh root@$VPS "ls -lh $DEST; tar tzf $DEST/*.tar.gz | head -40" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            last="$now"
          done
          echo "The backup did not finish within 70 minutes." ; exit 1
