<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="LED AD PRO"><title>LED AD PRO</title><style>
.lit,.on{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .32s cubic-bezier(.2,.8,.2,1.25) forwards}
.on{animation:pop .36s cubic-bezier(.2,.8,.2,1.3) .95s forwards}
.glow{transform-box:fill-box;transform-origin:center;opacity:0;animation:glow 2.6s ease-in-out 1.3s infinite}
.word{opacity:0;animation:fade .7s ease-out .75s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.35)}100%{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:0;transform:scale(1)}45%{opacity:.35;transform:scale(1.9)}}
@keyframes fade{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lit,.on,.word{animation:none;opacity:1}.glow{animation:none}}
</style><circle cx="50.88" cy="50.88" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="50.88" cy="50.88" r="26.88" fill="#FF1F6E" class="lit" style="animation-delay:0.15s"/><circle cx="120.00" cy="50.88" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="189.12" cy="50.88" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle class="glow" cx="189.12" cy="50.88" r="26.88" fill="#00C2F2"/><circle class="on" cx="189.12" cy="50.88" r="26.88" fill="#00C2F2"/><circle cx="50.88" cy="120.00" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="50.88" cy="120.00" r="26.88" fill="#FF1F6E" class="lit" style="animation-delay:0.27s"/><circle cx="120.00" cy="120.00" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="189.12" cy="120.00" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="50.88" cy="189.12" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="50.88" cy="189.12" r="26.88" fill="#FF1F6E" class="lit" style="animation-delay:0.39s"/><circle cx="120.00" cy="189.12" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="120.00" cy="189.12" r="26.88" fill="#FF1F6E" class="lit" style="animation-delay:0.51s"/><circle cx="189.12" cy="189.12" r="26.88" fill="#0B1B3F" fill-opacity="0.14"/><circle cx="189.12" cy="189.12" r="26.88" fill="#FF1F6E" class="lit" style="animation-delay:0.63s"/></svg>
