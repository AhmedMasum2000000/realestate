<title>Pattaya Homes Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================================
   Pattaya Homes Pro — art direction
   Ground: deep ocean at night. The Gulf after sunset, not a bright brochure.
   One accent (warm brass) used sparingly so it always means "act here".
   ========================================================================= */
:root{
  --bg:#F7F6F2; --bg-2:#EFEEE8; --surface:#FFFFFF; --surface-2:#FAF9F6;
  --ink:#0F1A1C; --ink-2:#33474A; --muted:#6C807F;
  --line:#DDDCD3; --line-2:#C9C8BD;
  --brass:#A9762B; --brass-2:#C89A4E; --deep:#0B2426; --deep-2:#123639;
  --sea:#1C5E5A; --coral:#B4503A;
  --shadow-s:0 1px 2px rgba(15,26,28,.05);
  --shadow-m:0 12px 32px -18px rgba(15,26,28,.32);
  --shadow-l:0 32px 70px -30px rgba(15,26,28,.42);
  --r:14px; --r-s:9px;
  /* Illustration tokens. Defined here, not on the <svg>, because the shared
     gradient in <defs> resolves variables against its own element. */
  --ck1:var(--deep-2); --ck2:var(--deep); --c1:var(--sea); --c2:var(--deep-2);
  --cg:var(--brass-2); --cw:var(--sea); --cs:var(--brass); --cr:var(--brass);
  --cp:var(--sea);
  --ease:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.35,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08191B; --bg-2:#0C2124; --surface:#0F2A2D; --surface-2:#123033;
  --ink:#EDF2F0; --ink-2:#B9CBC8; --muted:#7E9895;
  --line:#1D4145; --line-2:#2A575B;
  --brass:#D6A660; --brass-2:#E9C287; --deep:#06181A; --deep-2:#0A2225;
  --sea:#4FA9A1; --coral:#E08B74;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 12px 32px -18px rgba(0,0,0,.75);
  --shadow-l:0 32px 70px -30px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#08191B; --bg-2:#0C2124; --surface:#0F2A2D; --surface-2:#123033;
  --ink:#EDF2F0; --ink-2:#B9CBC8; --muted:#7E9895;
  --line:#1D4145; --line-2:#2A575B;
  --brass:#D6A660; --brass-2:#E9C287; --deep:#06181A; --deep-2:#0A2225;
  --sea:#4FA9A1; --coral:#E08B74;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 12px 32px -18px rgba(0,0,0,.75);
  --shadow-l:0 32px 70px -30px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.08;
  letter-spacing:-.02em;margin:0;text-wrap:balance}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:78rem;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}
.narrow{max-width:54rem}

/* ---- draft ribbon ---- */
.ribbon{background:var(--deep);color:var(--brass-2);text-align:center;padding:.45rem 1rem;
  font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;position:relative;z-index:60}

/* ---- scroll progress ---- */
.progress{position:fixed;top:0;left:0;height:2px;background:var(--brass);z-index:100;
  transition:width .1s linear;box-shadow:0 0 12px var(--brass)}

/* ---- nav ---- */
.nav{position:sticky;top:0;z-index:50;transition:all .5s var(--ease);
  border-bottom:1px solid transparent}
.nav.solid{background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px) saturate(140%);border-bottom-color:var(--line)}
.nav__in{display:flex;align-items:center;gap:2rem;padding:1rem 0;transition:padding .5s var(--ease)}
.nav.solid .nav__in{padding:.65rem 0}
.logo{display:flex;align-items:center;gap:.6rem;font-family:Fraunces,serif;font-weight:600;
  font-size:1.15rem;letter-spacing:-.02em}
.logo__m{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--brass),var(--brass-2));
  display:grid;place-items:center;color:var(--deep);font-family:"Inter Tight",sans-serif;
  font-weight:700;font-size:.78rem;flex:none;box-shadow:var(--shadow-s)}
.nav__links{margin-left:auto;display:flex;gap:1.75rem;font-size:.93rem;font-weight:500}
.nav__links a{position:relative;color:var(--ink-2);transition:color .3s}
.nav__links a::after{content:"";position:absolute;left:0;bottom:-4px;width:0;height:1.5px;
  background:var(--brass);transition:width .35s var(--ease)}
.nav__links a:hover{color:var(--ink)}
.nav__links a:hover::after{width:100%}
@media(max-width:56rem){.nav__links{display:none}}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.82rem 1.6rem;border-radius:100px;
  font-weight:600;font-size:.95rem;transition:transform .35s var(--ease),box-shadow .35s var(--ease),
  background .3s,color .3s;position:relative;overflow:hidden;will-change:transform}
.btn--p{background:var(--brass);color:var(--deep);box-shadow:var(--shadow-m)}
.btn--p:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow-l)}
.btn--g{border:1px solid var(--line-2);color:var(--ink);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.btn--g:hover{border-color:var(--brass);color:var(--brass);transform:translateY(-2px)}
.btn__sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,
  rgba(255,255,255,.42) 50%,transparent 70%);transform:translateX(-120%)}
.btn--p:hover .btn__sheen{transform:translateX(120%);transition:transform .75s var(--ease)}

/* ---- reveal ---- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .85s var(--ease),transform .85s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv-d1{transition-delay:.09s}.rv-d2{transition-delay:.18s}.rv-d3{transition-delay:.27s}
.rv-d4{transition-delay:.36s}.rv-d5{transition-delay:.45s}.rv-d6{transition-delay:.54s}

/* ---- hero ---- */
.hero{position:relative;min-height:clamp(38rem,92vh,54rem);display:flex;align-items:center;
  background:var(--deep);color:#F1EDE4;overflow:hidden;isolation:isolate}
.hero__sky{position:absolute;inset:-6% 0 -6%;z-index:0}
.hero__sky svg{width:100%;height:100%;display:block}
.hero__veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--deep) 45%,transparent) 0%,
    transparent 30%,transparent 70%,color-mix(in srgb,var(--deep) 60%,transparent) 100%)}
/* Water shimmer. Three offset drifts so the surface never looks like it is
   marching in step. */
.shim{animation:drift 9s ease-in-out infinite}
.shim2{animation-duration:12s;animation-delay:-3s}
.shim3{animation-duration:15s;animation-delay:-6s}
@keyframes drift{0%,100%{transform:translateX(-14px);opacity:.5}
  50%{transform:translateX(16px);opacity:1}}
.hero__in{position:relative;z-index:2;padding:6rem 0 5rem;width:100%}
.hero__kicker{display:inline-flex;align-items:center;gap:.6rem;font-size:.74rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass-2);font-weight:600;margin-bottom:1.5rem}
.hero__kicker::before{content:"";width:2rem;height:1px;background:var(--brass-2)}
.hero h1{font-size:clamp(2.4rem,6.4vw,4.8rem);font-weight:300;line-height:1.04;max-width:18ch}
.hero h1 em{font-style:normal;font-weight:600;color:var(--brass-2)}
.hero__p{font-size:clamp(1.02rem,1.7vw,1.2rem);color:#C9D6D2;max-width:34rem;margin:1.6rem 0 0;line-height:1.65}
.hero__cta{display:flex;flex-wrap:wrap;gap:.85rem;margin-top:2.4rem}
.hero .btn--g{border-color:rgba(255,255,255,.3);color:#F1EDE4;background:rgba(255,255,255,.06)}
.hero .btn--g:hover{border-color:var(--brass-2);color:var(--brass-2)}

/* kinetic word reveal */
.kin{display:inline-block;overflow:hidden;vertical-align:bottom;
  padding-bottom:.12em;margin-bottom:-.12em}
.kin>span{display:inline-block;transform:translateY(110%);
  animation:kinUp .95s var(--ease) forwards;will-change:transform}
@keyframes kinUp{to{transform:none}}

.scrollcue{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;color:#9FB3AE;font-size:.7rem;
  letter-spacing:.16em;text-transform:uppercase}
.scrollcue__l{width:1px;height:2.4rem;background:linear-gradient(var(--brass-2),transparent);
  animation:cue 2.2s var(--ease-io) infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}
  45%{transform:scaleY(1);transform-origin:top}
  55%{transform:scaleY(1);transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}}

/* ---- trust strip ---- */
.trust{background:var(--deep-2);color:#B9CBC8;border-top:1px solid rgba(255,255,255,.07)}
.trust__in{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1.5rem;padding:1.75rem 0}
.trust__i{display:flex;flex-direction:column;gap:.15rem}
.trust__n{font-family:Fraunces,serif;font-size:1.75rem;font-weight:600;color:var(--brass-2);
  font-variant-numeric:tabular-nums;line-height:1}
.trust__l{font-size:.82rem;color:#8FA5A1}

/* ---- section furniture ---- */
section{padding:clamp(4rem,9vw,7.5rem) 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:.6rem;font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass);font-weight:600}
.eyebrow::before{content:"";width:1.6rem;height:1px;background:var(--brass)}
.h2{font-size:clamp(1.9rem,4.4vw,3rem);margin:.9rem 0 0;font-weight:400}
.h2 em{font-style:normal;font-weight:600;color:var(--brass)}
.lead{color:var(--ink-2);font-size:1.05rem;max-width:40rem;margin:1rem 0 0}

/* ---- scroll story ---- */
.story{background:var(--bg-2)}
.beat{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:center;
  padding:clamp(2.5rem,6vw,4.5rem) 0;border-bottom:1px solid var(--line)}
.beat:last-child{border-bottom:0}
.beat:nth-child(even) .beat__art{order:-1}
@media(max-width:56rem){.beat{grid-template-columns:1fr}.beat:nth-child(even) .beat__art{order:0}}
.beat__n{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--brass);letter-spacing:.12em}
.beat h3{font-size:clamp(1.4rem,2.8vw,2rem);margin:.7rem 0 .8rem;font-weight:500}
.beat p{color:var(--ink-2);margin:0}
.beat__art{aspect-ratio:5/4;border-radius:var(--r);overflow:hidden;background:var(--deep-2);
  box-shadow:var(--shadow-l);position:relative}
.beat__art svg{width:100%;height:100%;display:block}

/* ---- filters ---- */
.filterbar{display:flex;flex-wrap:wrap;gap:.5rem;margin:2rem 0 0}
.chip{padding:.5rem 1.05rem;border-radius:100px;border:1px solid var(--line-2);font-size:.9rem;
  font-weight:500;color:var(--ink-2);background:var(--surface);transition:all .3s var(--ease)}
.chip:hover{border-color:var(--brass);color:var(--brass);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--deep)}
.resultline{margin:1.4rem 0 0;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- property grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.6rem;margin-top:1.4rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-s);cursor:pointer;text-align:left;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s;will-change:transform}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--shadow-l);border-color:var(--line-2)}
.pcard__art{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--deep-2)}
.pcard__art svg{width:100%;height:100%;display:block;transition:transform .9s var(--ease)}
.pcard:hover .pcard__art svg{transform:scale(1.07)}
.pcard__tag{position:absolute;top:.8rem;left:.8rem;background:var(--brass);color:var(--deep);
  font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:.24rem .6rem;border-radius:100px}
.pcard__tag--r{background:var(--sea);color:#fff}
.pcard__flag{position:absolute;top:.8rem;right:.8rem;background:color-mix(in srgb,var(--deep) 78%,transparent);
  color:var(--brass-2);font-size:.66rem;font-weight:600;padding:.24rem .6rem;border-radius:100px;
  backdrop-filter:blur(6px)}
.pcard__b{padding:1.1rem 1.25rem 1.35rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.pcard__place{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pcard__t{font-size:1.1rem;font-weight:500}
.pcard__price{font-family:Fraunces,serif;font-size:1.3rem;font-weight:600;color:var(--brass);
  font-variant-numeric:tabular-nums}
.pcard__anchor{font-size:.8rem;color:var(--muted);margin-top:-.15rem}
.pcard__f{list-style:none;display:flex;gap:1.1rem;padding:0;margin:.5rem 0 0;font-size:.86rem;
  color:var(--ink-2);border-top:1px solid var(--line);padding-top:.7rem}
.pcard__f strong{font-variant-numeric:tabular-nums}

/* ---- detail ---- */
.detail{animation:fadeUp .6s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:.45rem;font-size:.9rem;color:var(--muted);
  margin-bottom:1.5rem;transition:color .3s,gap .3s}
.back:hover{color:var(--brass);gap:.7rem}
.dhero{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--deep-2);
  box-shadow:var(--shadow-l)}
.dhero svg{width:100%;height:100%;display:block}
.dthumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:.6rem}
.dthumbs button{aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;background:var(--deep-2);
  border:2px solid transparent;transition:border-color .3s,transform .3s}
.dthumbs button:hover{transform:translateY(-2px)}
.dthumbs button[aria-current="true"]{border-color:var(--brass)}
.dthumbs svg{width:100%;height:100%;display:block}
.dgrid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(17rem,1fr);gap:2.5rem;margin-top:2rem}
@media(max-width:58rem){.dgrid{grid-template-columns:1fr}}
.specs{width:100%;border-collapse:collapse;font-size:.94rem}
.specs th,.specs td{text-align:left;padding:.6rem .2rem;border-bottom:1px solid var(--line)}
.specs th{color:var(--muted);font-weight:500}
.specs td{font-variant-numeric:tabular-nums;font-weight:500}
.aside{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:1.4rem;position:sticky;top:5.5rem;box-shadow:var(--shadow-m)}

/* ---- enquiry ladder ---- */
.ladder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:1.5rem;box-shadow:var(--shadow-m)}
.ladder__steps{display:flex;gap:.4rem;margin-bottom:1.1rem}
.ladder__pip{height:3px;flex:1;background:var(--line);border-radius:2px;transition:background .45s var(--ease)}
.ladder__pip.on{background:var(--brass)}
.opts{display:flex;flex-direction:column;gap:.55rem;margin-top:.9rem}
.opt{text-align:left;padding:.85rem 1.1rem;border:1px solid var(--line-2);border-radius:var(--r-s);
  background:var(--surface-2);font-weight:500;transition:all .3s var(--ease)}
.opt:hover{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 7%,var(--surface));
  transform:translateX(4px)}
.ladder__done{text-align:center;padding:1rem 0}
.ladder__check{width:3rem;height:3rem;border-radius:50%;background:var(--sea);margin:0 auto .9rem;
  display:grid;place-items:center;color:#fff;font-size:1.4rem;animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

/* ---- link architecture ---- */
.linkzone{background:var(--deep);color:#C9D6D2}
.linkzone .h2{color:#F1EDE4}
.linkzone .eyebrow{color:var(--brass-2)}
.linkzone .eyebrow::before{background:var(--brass-2)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1.6rem;margin-top:2.2rem}
.lcol h4{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-2);
  font-family:"Inter Tight",sans-serif;font-weight:600;margin-bottom:.75rem}
.lcol ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.42rem;font-size:.93rem}
.lcol a{color:#B9CBC8;transition:color .3s,padding-left .3s}
.lcol a:hover{color:var(--brass-2);padding-left:.3rem}

footer{background:var(--deep-2);color:#8FA5A1;padding:2rem 0;font-size:.86rem;
  border-top:1px solid rgba(255,255,255,.07)}
.foot{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
  .kin>span{transform:none;animation:none}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
/* ===========================================================================
   Hooks
   ======================================================================== */

// Reveal on scroll. One observer for the whole page rather than one per node.
function useReveal(){
  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced || typeof IntersectionObserver === "undefined") {
      document.querySelectorAll(".rv").forEach(n=>n.classList.add("in"));
      return;
    }
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
      });
    },{threshold:.12, rootMargin:"0px 0px -8% 0px"});
    const scan = () => document.querySelectorAll(".rv:not(.in)").forEach(n=>io.observe(n));
    scan();
    const mo = new MutationObserver(scan);
    mo.observe(document.body,{childList:true,subtree:true});

    // Safety net. Content that starts at opacity:0 and never gets revealed is
    // invisible content, which is far worse than an un-animated page. If
    // anything above the fold has not fired within a few seconds, show it.
    const net = setTimeout(()=>{
      document.querySelectorAll(".rv:not(.in)").forEach(n=>{
        if (n.getBoundingClientRect().top < window.innerHeight) n.classList.add("in");
      });
    }, 2500);

    return ()=>{io.disconnect(); mo.disconnect(); clearTimeout(net);};
  },[]);
}

function useScrollProgress(){
  const [p,setP] = useState(0);
  const [solid,setSolid] = useState(false);
  useEffect(()=>{
    let raf = 0;
    const on = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        const h = document.documentElement.scrollHeight - window.innerHeight;
        setP(h > 0 ? (window.scrollY / h) * 100 : 0);
        setSolid(window.scrollY > 40);
      });
    };
    window.addEventListener("scroll",on,{passive:true});
    on();
    return ()=>{window.removeEventListener("scroll",on); cancelAnimationFrame(raf);};
  },[]);
  return {p,solid};
}

// Count up when the element first enters view. Numbers that animate in read as
// claims being made; numbers that are simply there read as facts. The former
// holds attention on a trust strip.
function useCountUp(target, duration=1400){
  const [v,setV] = useState(0);
  const ref = useRef(null);
  useEffect(()=>{
    const node = ref.current;
    if(!node) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setV(target); return; }
    const io = new IntersectionObserver(es=>{
      if(!es[0].isIntersecting) return;
      io.disconnect();
      const t0 = performance.now();
      const tick = now => {
        const k = Math.min(1,(now-t0)/duration);
        setV(Math.round(target * (1 - Math.pow(1-k,3))));
        if(k<1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    },{threshold:.5});
    io.observe(node);
    return ()=>io.disconnect();
  },[target,duration]);
  return [v,ref];
}

// Very light parallax. Transform only, so it never triggers layout.
function useParallax(strength=0.18){
  const ref = useRef(null);
  useEffect(()=>{
    const node = ref.current;
    if(!node) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf = 0;
    const on = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        node.style.transform = `translate3d(0,${window.scrollY * strength}px,0)`;
      });
    };
    window.addEventListener("scroll",on,{passive:true});
    return ()=>{window.removeEventListener("scroll",on); cancelAnimationFrame(raf);};
  },[strength]);
  return ref;
}
</script>

<script>
/* ---------------------------------------------------------------------------
   Enquiry ladder.

   Three small questions before the contact field rather than one form asking
   for everything. Each answer is a low-cost commitment, and by the time the
   email box appears the visitor has already invested enough to finish it.
   This is the honest version of commitment-and-consistency: nothing is
   hidden, nothing is fake, and the questions genuinely shape the reply.
------------------------------------------------------------------------- */
const LADDER = [
  {q:"What is the place for?",
   a:["Somewhere to retire","A holiday home","An investment to let","Not sure yet"]},
  {q:"Roughly what budget?",
   a:["Under ฿3M","฿3M – ฿8M","฿8M – ฿20M","Over ฿20M","Renting, not buying"]},
  {q:"When would you want to move?",
   a:["Within 3 months","3 – 12 months","Just researching"]},
];

const EnquiryLadder = ({compact}) => {
  const [step,setStep] = useState(0);
  const [answers,setAnswers] = useState([]);
  const done = step >= LADDER.length;

  const pick = a => { setAnswers(v=>[...v,a]); setStep(s=>s+1); };

  return html`
    <div class="ladder">
      <div class="ladder__steps" aria-hidden="true">
        ${LADDER.map((_,i)=>html`<span key=${i} class=${"ladder__pip" + (i<step?" on":"")}></span>`)}
      </div>

      ${!done ? html`
        <div key=${step}>
          <span class="eyebrow">Step ${step+1} of ${LADDER.length}</span>
          <h3 style=${{fontSize:compact?"1.15rem":"1.35rem",margin:".7rem 0 0",fontWeight:500}}>
            ${LADDER[step].q}
          </h3>
          <div class="opts">
            ${LADDER[step].a.map(a=>html`
              <button class="opt" key=${a} onClick=${()=>pick(a)}>${a}</button>`)}
          </div>
          ${step>0 ? html`<button class="back" style=${{marginTop:"1rem",marginBottom:0}}
            onClick=${()=>{setStep(s=>s-1);setAnswers(v=>v.slice(0,-1));}}>← Back</button>` : null}
        </div>`
      : html`
        <div class="ladder__done">
          <div class="ladder__check" aria-hidden="true">✓</div>
          <h3 style=${{fontSize:"1.25rem",fontWeight:500}}>That is enough to be useful</h3>
          <p style=${{color:"var(--ink-2)",margin:".6rem 0 1.1rem",fontSize:".94rem"}}>
            ${answers[0]}, ${answers[1] ? answers[1].toLowerCase() : ""}, ${answers[2] ? answers[2].toLowerCase() : ""}.
            Leave an email and you will get a shortlist that fits it — not a database dump.
          </p>
          <form onSubmit=${e=>e.preventDefault()} style=${{display:"flex",gap:".5rem",flexWrap:"wrap"}}>
            <input type="email" required placeholder="you@example.com" aria-label="Your email"
              style=${{flex:"1 1 12rem",padding:".78rem 1rem",borderRadius:"100px",
                border:"1px solid var(--line-2)",background:"var(--surface-2)",color:"var(--ink)",font:"inherit"}} />
            <button class="btn btn--p" type="submit"><span class="btn__sheen"></span>Send it</button>
          </form>
          <p style=${{fontSize:".78rem",color:"var(--muted)",margin:".8rem 0 0"}}>
            Preview only — this form is not connected to anything.
          </p>
        </div>`}
    </div>`;
};

const Detail = ({p,onBack,onOpen}) => {
  const [shot,setShot] = useState(0);
  const kinds = [p.art,"tower","villa","town"];
  const related = PROPS.filter(x=>x.id!==p.id && (x.area===p.area || x.type===p.type)).slice(0,3);

  useEffect(()=>{window.scrollTo({top:0,behavior:"instant"});},[p.id]);

  const specs = [
    ["Bedrooms",p.beds],["Bathrooms",p.baths],["Interior",p.sqm+" sqm"],
    ["Land",p.land ? p.land+" sqm" : ""],["Floor",p.floor||""],
    ["Project",p.project||""],["Reference",p.ref],
  ].filter(([,v])=>v!=="" && v!==undefined && v!==null);

  return html`
    <section class="detail"><div class="wrap">
      <button class="back" onClick=${onBack}>← All properties</button>

      <nav class="mono" style=${{fontSize:".78rem",color:"var(--muted)",marginBottom:".9rem"}}>
        <a href="#" onClick=${e=>{e.preventDefault();onBack();}}>Properties</a>
        <span> / </span><a href="#properties">${p.area}</a>
        <span> / </span><span>${p.type}</span>
      </nav>

      <h1 style=${{fontSize:"clamp(1.8rem,4vw,2.8rem)",fontWeight:500}}>${p.t}</h1>
      <p style=${{fontFamily:"Fraunces,serif",fontSize:"1.7rem",color:"var(--brass)",
        margin:".5rem 0 1.5rem",fontWeight:600}}>${priceOf(p)}</p>

      <div class="dhero"><${Art} kind=${kinds[shot]} /></div>
      <div class="dthumbs">
        ${kinds.map((k,i)=>html`
          <button key=${i} aria-current=${shot===i} onClick=${()=>setShot(i)}
            aria-label=${"View image " + (i+1)}><${Art} kind=${k} /></button>`)}
      </div>

      <div class="dgrid">
        <div>
          <p style=${{fontSize:"1.06rem",color:"var(--ink-2)",lineHeight:1.75}}>${p.d}</p>

          <h3 style=${{fontSize:"1.2rem",margin:"2rem 0 .8rem",fontWeight:500}}>Features</h3>
          <div class="filterbar" style=${{margin:0}}>
            ${p.feat.map(f=>html`<span class="chip" key=${f} style=${{cursor:"default"}}>${f}</span>`)}
          </div>

          <h3 style=${{fontSize:"1.2rem",margin:"2.2rem 0 .8rem",fontWeight:500}}>Details</h3>
          <table class="specs"><tbody>
            ${specs.map(([k,v])=>html`<tr key=${k}><th scope="row">${k}</th><td>${v}</td></tr>`)}
          </tbody></table>
        </div>

        <aside>
          <div class="aside">
            <h3 style=${{fontSize:"1.1rem",fontWeight:500,marginBottom:".3rem"}}>Ask about this one</h3>
            <p style=${{fontSize:".88rem",color:"var(--muted)",margin:"0 0 1rem"}}>
              Reference ${p.ref}. Reply typically within 48 hours.
            </p>
            <${EnquiryLadder} compact=${true} />
          </div>
        </aside>
      </div>

      ${related.length ? html`
        <div style=${{marginTop:"3.5rem"}}>
          <span class="eyebrow">Nearby</span>
          <h2 class="h2" style=${{fontSize:"1.7rem"}}>Others in <em>${p.area}</em></h2>
          <div class="grid">
            ${related.map((r,i)=>html`<${PropertyCard} key=${r.id} p=${r} i=${i} onOpen=${onOpen} />`)}
          </div>
        </div>` : null}
    </div></section>`;
};
</script>

<script>
/* ---------------------------------------------------------------------------
   Internal link architecture. Every area and property type gets a real,
   crawlable route in from every page -- this is the part of SEO that is
   entirely within your control and carries no risk.
------------------------------------------------------------------------- */
const LinkZone = () => html`
  <section class="linkzone" id="areas"><div class="wrap">
    <div class="rv">
      <span class="eyebrow">Browse</span>
      <h2 class="h2">Every area, <em>its own page</em></h2>
      <p class="lead" style=${{color:"#B9CBC8"}}>
        Each of these is a real URL with its own title, description and content
        — not a filter that leaves the address bar unchanged.
      </p>
    </div>
    <div class="lgrid rv rv-d1">
      <div class="lcol"><h4>By area</h4><ul>
        ${AREAS.map(a=>html`<li key=${a}><a href="#properties">${a} property</a></li>`)}
      </ul></div>
      <div class="lcol"><h4>By type</h4><ul>
        ${["Condo","Villa","House","Townhouse","Penthouse","Land"].map(t=>html`
          <li key=${t}><a href="#properties">${t}s in Pattaya</a></li>`)}
      </ul></div>
      <div class="lcol"><h4>By intent</h4><ul>
        ${["Sea-view condos","Pool villas","Foreign freehold","Under ฿5M",
           "Long-term rentals","New developments"].map(t=>html`
          <li key=${t}><a href="#properties">${t}</a></li>`)}
      </ul></div>
      <div class="lcol"><h4>Guides</h4><ul>
        ${["Buying as a foreigner","Freehold vs leasehold","Transfer fees and taxes",
           "Choosing an area","Off-plan risks"].map(t=>html`
          <li key=${t}><a href="#how">${t}</a></li>`)}
      </ul></div>
    </div>
  </div></section>`;

const Enquire = () => html`
  <section id="enquire"><div class="wrap narrow">
    <div class="rv" style=${{textAlign:"center",marginBottom:"2rem"}}>
      <span class="eyebrow" style=${{justifyContent:"center"}}>Talk to us</span>
      <h2 class="h2">Three questions, <em>then a shortlist</em></h2>
      <p class="lead" style=${{margin:"1rem auto 0"}}>
        Not a database dump. Answer these and the reply is a handful of properties
        that actually fit, with the reasons attached.
      </p>
    </div>
    <div class="rv rv-d1"><${EnquiryLadder} /></div>
  </div></section>`;

const Footer = () => html`
  <footer><div class="wrap foot">
    <span>© 2026 Pattaya Homes Pro · Chonburi, Thailand</span>
    <span>Design preview — sample data, nothing connected</span>
  </div></footer>`;

/* ---------------------------------------------------------------------------
   App
------------------------------------------------------------------------- */
function App(){
  const [view,setView] = useState({name:"home"});
  const {p,solid} = useScrollProgress();
  useReveal();

  const open = useCallback(prop=>{
    setView({name:"detail",prop});
    history.pushState({id:prop.id},"","#property-"+prop.id);
  },[]);
  const home = useCallback(()=>{
    setView({name:"home"});
    history.pushState({},"","#");
  },[]);

  // Back button returns to the list rather than leaving the site.
  useEffect(()=>{
    const on = () => setView({name:"home"});
    window.addEventListener("popstate",on);
    return ()=>window.removeEventListener("popstate",on);
  },[]);

  const scrollToProperties = () =>
    document.getElementById("properties")?.scrollIntoView({behavior:"smooth"});

  return html`
    <${React.Fragment}>
      <${Defs} />
      <div class="progress" style=${{width:p+"%"}} aria-hidden="true"></div>
      <p class="ribbon">Design preview · pattayahomespro.com · not yet published</p>
      <${Nav} solid=${solid} onHome=${home} />
      ${view.name === "home" ? html`
        <${React.Fragment}>
          <${Hero} onExplore=${scrollToProperties} />
          <${TrustStrip} />
          <${Explorer} onOpen=${open} />
          <${Story} />
          <${LinkZone} />
          <${Enquire} />
        </>`
      : html`<${Detail} p=${view.prop} onBack=${home} onOpen=${open} />`}
      <${Footer} />
    </>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
