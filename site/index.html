<style>
/* ==========================================================================
   Pattaya Home Pro — art direction
   Not the cool coastal luxury look. This is a working brokerage: warm sand,
   charcoal, terracotta. Editorial rather than aspirational — big type, hard
   rules, asymmetric grid. Serif body copy so it reads like someone wrote it.
   ========================================================================= */
:root{
  --sand:#F6F1EA; --sand-2:#EDE5DA; --paper:#FFFDFA; --paper-2:#F9F5EF;
  --ink:#191412; --ink-2:#453A34; --muted:#7A6A61;
  --rule:#DED3C6; --rule-2:#C6B7A6;
  --terra:#B4472C; --terra-2:#D4694C; --teal:#2F6E7E; --teal-2:#4B93A4;
  --char:#221B18; --char-2:#2E2521;
  --sh-s:0 1px 2px rgba(25,20,18,.06);
  --sh-m:0 14px 34px -20px rgba(25,20,18,.34);
  --sh-l:0 34px 70px -28px rgba(25,20,18,.44);
  --r:4px; --ease:cubic-bezier(.22,1,.36,1);
  /* Illustration tokens. On :root so the shared gradient in <defs> can see
     them; they indirect through the theme tokens above, so both themes work. */
  --k1:var(--char-2); --k2:var(--char); --m1:var(--teal); --m2:var(--char-2);
  --gl:var(--terra-2); --wt:var(--teal); --sn:var(--terra); --rf:var(--terra);
  --pl:var(--teal-2);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sand:#14100E; --sand-2:#1B1613; --paper:#1E1815; --paper-2:#251E1A;
  --ink:#F2EBE4; --ink-2:#C9BCB2; --muted:#94847A;
  --rule:#332A25; --rule-2:#463A32;
  --terra:#E07C60; --terra-2:#EC9B82; --teal:#63AEBF; --teal-2:#87C6D4;
  --char:#0F0C0A; --char-2:#181310;
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 14px 34px -20px rgba(0,0,0,.8);
  --sh-l:0 34px 70px -28px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --sand:#14100E; --sand-2:#1B1613; --paper:#1E1815; --paper-2:#251E1A;
  --ink:#F2EBE4; --ink-2:#C9BCB2; --muted:#94847A;
  --rule:#332A25; --rule-2:#463A32;
  --terra:#E07C60; --terra-2:#EC9B82; --teal:#63AEBF; --teal-2:#87C6D4;
  --char:#0F0C0A; --char-2:#181310;
  --sh-s:0 1px 2px rgba(0,0,0,.5);
  --sh-m:0 14px 34px -20px rgba(0,0,0,.8);
  --sh-l:0 34px 70px -28px rgba(0,0,0,.9);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--sand);color:var(--ink);
  font-family:Lora,Georgia,serif;font-size:16.5px;line-height:1.68;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,.sans{font-family:Outfit,system-ui,sans-serif;font-weight:600;
  line-height:1.06;letter-spacing:-.025em;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:80rem;margin:0 auto;padding:0 clamp(1.1rem,4vw,3rem)}
.narrow{max-width:46rem}
.tnum{font-variant-numeric:tabular-nums}
img,svg{max-width:100%}

/* ---- draft ribbon ---- */
.ribbon{background:var(--char);color:var(--terra-2);text-align:center;padding:.42rem 1rem;
  font-family:Outfit,sans-serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;position:relative;z-index:60}
.bar-progress{position:fixed;top:0;left:0;height:2px;background:var(--terra);z-index:100;
  transition:width .1s linear}

/* ---- nav ---- */
.nav{position:sticky;top:0;z-index:50;border-bottom:1px solid transparent;transition:all .45s var(--ease)}
.nav.solid{background:color-mix(in srgb,var(--sand) 90%,transparent);backdrop-filter:blur(14px);
  border-bottom-color:var(--rule)}
.nav__in{display:flex;align-items:center;gap:2rem;padding:1.15rem 0;transition:padding .45s var(--ease)}
.nav.solid .nav__in{padding:.7rem 0}
.logo{display:flex;align-items:baseline;gap:.55rem;font-family:Outfit,sans-serif;font-weight:700;
  font-size:1.18rem;letter-spacing:-.03em}
.logo b{color:var(--terra);font-weight:700}
.nav__l{margin-left:auto;display:flex;gap:1.7rem;font-family:Outfit,sans-serif;font-size:.93rem;font-weight:500}
.nav__l a{color:var(--ink-2);position:relative;transition:color .3s}
.nav__l a::after{content:"";position:absolute;left:0;bottom:-5px;width:0;height:2px;background:var(--terra);
  transition:width .35s var(--ease)}
.nav__l a:hover{color:var(--ink)}.nav__l a:hover::after{width:100%}
@media(max-width:60rem){.nav__l{display:none}}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.82rem 1.55rem;border-radius:var(--r);
  font-family:Outfit,sans-serif;font-weight:600;font-size:.94rem;letter-spacing:-.01em;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s,color .3s,border-color .3s;
  position:relative;overflow:hidden}
.btn--p{background:var(--terra);color:#FFF9F5;box-shadow:var(--sh-m)}
.btn--p:hover{transform:translateY(-2px);box-shadow:var(--sh-l);background:var(--terra-2)}
.btn--o{border:1.5px solid var(--rule-2);color:var(--ink)}
.btn--o:hover{border-color:var(--terra);color:var(--terra);transform:translateY(-2px)}
.btn__sh{position:absolute;inset:0;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.4) 50%,transparent 68%);
  transform:translateX(-130%)}
.btn--p:hover .btn__sh{transform:translateX(130%);transition:transform .8s var(--ease)}

/* ---- reveal ---- */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}
.d4{transition-delay:.32s}.d5{transition-delay:.4s}.d6{transition-delay:.48s}

/* ---- hero: editorial split ---- */
.hero{padding:clamp(2.5rem,6vw,4.5rem) 0 clamp(3rem,7vw,5.5rem);position:relative;overflow:hidden}
.hero__g{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(1.5rem,5vw,4rem);align-items:center}

.hero__kick{display:inline-flex;align-items:center;gap:.7rem;font-family:Outfit,sans-serif;font-size:.72rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:1.4rem}
.hero__kick::before{content:"";width:2.2rem;height:2px;background:var(--terra)}
.hero h1{font-size:clamp(2.5rem,6.6vw,4.6rem);font-weight:600;line-height:1.02;letter-spacing:-.04em}
.hero h1 span{display:block}
.hero h1 .accent{color:var(--terra);font-style:normal}
.hero__p{font-size:clamp(1.02rem,1.5vw,1.16rem);color:var(--ink-2);max-width:33rem;margin:1.5rem 0 0}
.hero__cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2.1rem}
.hero__meta{display:flex;flex-wrap:wrap;gap:1.6rem;margin-top:2.4rem;padding-top:1.6rem;
  border-top:1px solid var(--rule)}
.hero__mi{display:flex;flex-direction:column}
.hero__mn{font-family:Outfit,sans-serif;font-size:1.6rem;font-weight:600;color:var(--ink);line-height:1}
.hero__ml{font-family:Outfit,sans-serif;font-size:.78rem;color:var(--muted);margin-top:.2rem}

/* stacked collage */
.collage{position:relative;width:100%;aspect-ratio:1/1.02;max-width:34rem;
  margin-left:auto;justify-self:end}
.cl{position:absolute;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-l);
  background:var(--char-2);will-change:transform}
.cl svg{width:100%;height:100%;display:block}
/* Overlap enough to read as a stack, not so much that a caption is hidden. */
.cl--a{width:52%;left:0;top:9%;aspect-ratio:4/5;z-index:2}
.cl--b{width:47%;right:0;top:0;aspect-ratio:4/3;z-index:3}
.cl--c{width:50%;right:3%;bottom:0;aspect-ratio:4/3;z-index:4}
/* Captions sit at the top: the tiles overlap at their lower edges, so a label
   at the bottom of one disappears under the next. */
.cl__cap{position:absolute;left:0;right:0;top:0;padding:.6rem .8rem .9rem;
  background:linear-gradient(rgba(15,12,10,.9),transparent);color:#F6F1EA;
  font-family:Outfit,sans-serif;font-size:.74rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}

/* ---- section furniture ---- */
section{padding:clamp(3.5rem,8vw,6.5rem) 0}
.eyebrow{display:inline-flex;align-items:center;gap:.65rem;font-family:Outfit,sans-serif;font-size:.71rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--terra);font-weight:600}
.eyebrow::before{content:"";width:1.8rem;height:2px;background:var(--terra)}
.h2{font-size:clamp(1.85rem,4.2vw,2.9rem);margin:.85rem 0 0;font-weight:600;letter-spacing:-.03em}
.h2 .accent{color:var(--terra)}
.lead{color:var(--ink-2);max-width:40rem;margin:1rem 0 0}
.rule{height:1px;background:var(--rule);margin:0}

/* ---- segments ---- */
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:0;margin-top:2.5rem;
  border-top:1px solid var(--rule)}
.seg{padding:1.7rem 1.5rem 1.7rem 0;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.seg:last-child{border-right:0}
@media(max-width:52rem){.seg{border-right:0;padding-right:0}}
.seg__n{font-family:Outfit,sans-serif;font-size:.72rem;letter-spacing:.14em;color:var(--terra);font-weight:600}
.seg h3{font-size:1.28rem;margin:.6rem 0 .5rem;font-weight:600}
.seg p{margin:0;color:var(--ink-2);font-size:.97rem}

/* ---- filters ---- */
.fbar{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.5rem}
.chip{padding:.48rem 1rem;border-radius:var(--r);border:1px solid var(--rule-2);
  font-family:Outfit,sans-serif;font-size:.88rem;font-weight:500;color:var(--ink-2);
  background:var(--paper);transition:all .28s var(--ease)}
.chip:hover{border-color:var(--terra);color:var(--terra)}
.chip[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#FFF9F5}
.rline{margin:1.3rem 0 0;font-family:Outfit,sans-serif;font-size:.88rem;color:var(--muted)}

/* ---- property cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19.5rem,1fr));gap:1.5rem;margin-top:1.2rem}
.pc{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;text-align:left;box-shadow:var(--sh-s);cursor:pointer;
  transition:transform .48s var(--ease),box-shadow .48s var(--ease),border-color .35s}
.pc:hover{transform:translateY(-5px);box-shadow:var(--sh-l);border-color:var(--rule-2)}
.pc__art{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--char-2)}
.pc__art svg{width:100%;height:100%;display:block;transition:transform .9s var(--ease)}
.pc:hover .pc__art svg{transform:scale(1.06)}
.pc__tag{position:absolute;top:.75rem;left:.75rem;font-family:Outfit,sans-serif;font-size:.65rem;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .6rem;border-radius:2px;
  background:var(--terra);color:#FFF9F5}
.pc__tag--r{background:var(--teal)}
.pc__tag--b{background:var(--char);color:var(--terra-2)}
.pc__note{position:absolute;top:.75rem;right:.75rem;font-family:Outfit,sans-serif;font-size:.65rem;
  font-weight:600;padding:.25rem .6rem;border-radius:2px;background:rgba(20,16,14,.8);color:#F6F1EA;
  backdrop-filter:blur(5px)}
.pc__b{padding:1.05rem 1.15rem 1.25rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.pc__pl{font-family:Outfit,sans-serif;font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.pc__t{font-family:Outfit,sans-serif;font-size:1.08rem;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.pc__pr{font-family:Outfit,sans-serif;font-size:1.24rem;font-weight:600;color:var(--terra)}
.pc__an{font-size:.83rem;color:var(--muted);margin-top:-.18rem}
.pc__f{list-style:none;display:flex;gap:1.05rem;padding:.65rem 0 0;margin:.45rem 0 0;
  font-family:Outfit,sans-serif;font-size:.85rem;color:var(--ink-2);border-top:1px solid var(--rule)}

/* ---- detail ---- */
.detail{animation:fu .55s var(--ease)}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.crumbs{font-family:Outfit,sans-serif;font-size:.83rem;color:var(--muted);margin-bottom:1rem}
.crumbs a{color:var(--muted);transition:color .3s}
.crumbs a:hover{color:var(--terra)}
.crumbs span{margin:0 .45rem}
.back{display:inline-flex;align-items:center;gap:.45rem;font-family:Outfit,sans-serif;font-size:.9rem;
  color:var(--muted);margin-bottom:1.2rem;transition:gap .3s,color .3s}
.back:hover{color:var(--terra);gap:.7rem}
.dhero{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--char-2);box-shadow:var(--sh-l)}
.dhero svg{width:100%;height:100%;display:block}
.dth{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-top:.55rem}
.dth button{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--char-2);
  border:2px solid transparent;transition:border-color .3s,transform .3s}
.dth button:hover{transform:translateY(-2px)}
.dth button[aria-current="true"]{border-color:var(--terra)}
.dth svg{width:100%;height:100%;display:block}
.dg{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(17rem,1fr);gap:2.5rem;margin-top:2.2rem}
@media(max-width:60rem){.dg{grid-template-columns:1fr}}
.specs{width:100%;border-collapse:collapse;font-family:Outfit,sans-serif;font-size:.93rem}
.specs th,.specs td{text-align:left;padding:.62rem .2rem;border-bottom:1px solid var(--rule)}
.specs th{color:var(--muted);font-weight:500}
.specs td{font-weight:600}
.aside{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:1.35rem;
  position:sticky;top:5.5rem;box-shadow:var(--sh-m)}

/* ---- ladder ---- */
.ladder{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:1.4rem;
  box-shadow:var(--sh-m)}
.pips{display:flex;gap:.35rem;margin-bottom:1rem}
.pip{height:3px;flex:1;background:var(--rule);border-radius:2px;transition:background .45s var(--ease)}
.pip.on{background:var(--terra)}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-top:.85rem}
.opt{text-align:left;padding:.8rem 1.05rem;border:1px solid var(--rule-2);border-radius:var(--r);
  background:var(--paper-2);font-family:Outfit,sans-serif;font-weight:500;font-size:.94rem;
  transition:all .28s var(--ease)}
.opt:hover{border-color:var(--terra);background:color-mix(in srgb,var(--terra) 8%,var(--paper));
  transform:translateX(4px)}
.done{text-align:center;padding:.8rem 0}
.done__c{width:2.8rem;height:2.8rem;border-radius:50%;background:var(--teal);margin:0 auto .8rem;
  display:grid;place-items:center;color:#fff;font-size:1.3rem;animation:pop .45s var(--ease)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.inp{flex:1 1 12rem;padding:.76rem 1rem;border-radius:var(--r);border:1px solid var(--rule-2);
  background:var(--paper-2);color:var(--ink);font:inherit;font-size:.95rem}

/* ---- link zone ---- */
.lz{background:var(--char);color:#C6B7A6}
.lz .h2{color:#F6F1EA}
.lz .eyebrow{color:var(--terra-2)}.lz .eyebrow::before{background:var(--terra-2)}
.lz .lead{color:#B0A196}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1.6rem;margin-top:2.2rem}
.lc h4{font-family:Outfit,sans-serif;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--terra-2);font-weight:600;margin-bottom:.7rem}
.lc ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.4rem;
  font-family:Outfit,sans-serif;font-size:.92rem}
.lc a{color:#B0A196;transition:color .3s,padding-left .3s}
.lc a:hover{color:var(--terra-2);padding-left:.3rem}

footer{background:var(--char-2);color:#8E7F75;padding:2rem 0;font-family:Outfit,sans-serif;font-size:.85rem}
.foot{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>

/* ---- hooks -------------------------------------------------------------- */
function useReveal(){
  useEffect(()=>{
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced || typeof IntersectionObserver==="undefined"){
      document.querySelectorAll(".rv").forEach(n=>n.classList.add("in")); return;
    }
    const io=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
    }),{threshold:.1,rootMargin:"0px 0px -6% 0px"});
    const scan=()=>document.querySelectorAll(".rv:not(.in)").forEach(n=>io.observe(n));
    scan();
    const mo=new MutationObserver(scan); mo.observe(document.body,{childList:true,subtree:true});
    // Never leave content stranded at opacity 0.
    const net=setTimeout(()=>document.querySelectorAll(".rv:not(.in)").forEach(n=>{
      if(n.getBoundingClientRect().top < innerHeight) n.classList.add("in");
    }),2400);
    return ()=>{io.disconnect();mo.disconnect();clearTimeout(net);};
  },[]);
}
function useChrome(){
  const [s,setS]=useState({p:0,solid:false});
  useEffect(()=>{
    let raf=0;
    const on=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
      const h=document.documentElement.scrollHeight-innerHeight;
      setS({p:h>0?(scrollY/h)*100:0, solid:scrollY>40});
    });};
    addEventListener("scroll",on,{passive:true}); on();
    return ()=>{removeEventListener("scroll",on);cancelAnimationFrame(raf);};
  },[]);
  return s;
}
function useCount(target,ms=1300){
  const [v,setV]=useState(0); const ref=useRef(null);
  useEffect(()=>{
    const n=ref.current; if(!n) return;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){setV(target);return;}
    const io=new IntersectionObserver(es=>{
      if(!es[0].isIntersecting) return; io.disconnect();
      const t0=performance.now();
      const tick=now=>{const k=Math.min(1,(now-t0)/ms);
        setV(Math.round(target*(1-Math.pow(1-k,3)))); if(k<1) requestAnimationFrame(tick);};
      requestAnimationFrame(tick);
    },{threshold:.5});
    io.observe(n); return ()=>io.disconnect();
  },[target,ms]);
  return [v,ref];
}
// Each collage tile drifts at its own rate, which is what reads as depth.
function useDrift(rate){
  const ref=useRef(null);
  useEffect(()=>{
    const n=ref.current; if(!n) return;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf=0;
    const on=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
      n.style.transform=`translate3d(0,${scrollY*rate}px,0)`;});};
    addEventListener("scroll",on,{passive:true});
    return ()=>{removeEventListener("scroll",on);cancelAnimationFrame(raf);};
  },[rate]);
  return ref;
}

      <div class="lc"><h4>Listings</h4><ul>${P.slice(0,6).map(p=>html`
        <li key=${p.id}><a href=${"#"+p.id} onClick=${e=>{e.preventDefault();open(p);}}>${p.t}</a></li>`)}</ul></div>
      <div class="lc"><h4>Guides</h4><ul>${["Buying as a foreigner","Freehold vs leasehold",
        "Transfer fees explained","Buying a Pattaya bar","Choosing an area"].map(g=>html`
        <li key=${g}><a href="#segments">${g}</a></li>`)}</ul></div>
    </div>
  </div></section>`;

const Enquire = () => html`
  <section id="enquire"><div class="wrap narrow">
    <div class="rv" style=${{textAlign:"center",marginBottom:"1.8rem"}}>
      <span class="eyebrow" style=${{justifyContent:"center"}}>Talk to us</span>
      <h2 class="h2">Three questions, <span class="accent">then a shortlist</span></h2>
      <p class="lead" style=${{margin:"1rem auto 0"}}>Not a database dump. Answer these and
        the reply is a handful that actually fit, with the reasons attached.</p></div>
    <div class="rv d1"><${Ladder} /></div>
  </div></section>`;

function App(){
  const [view,setView]=useState({n:"home"});
  const {p,solid}=useChrome();
  useReveal();
  const open=useCallback(x=>{setView({n:"d",p:x});history.pushState({id:x.id},"","#"+x.id);},[]);
  const home=useCallback(()=>{setView({n:"home"});history.pushState({},"","#");},[]);
  useEffect(()=>{
    const on=()=>{const id=location.hash.slice(1);const f=P.find(x=>x.id===id);
      setView(f?{n:"d",p:f}:{n:"home"});};
    addEventListener("popstate",on);
    if(location.hash.length>1) on();
    return ()=>removeEventListener("popstate",on);
  },[]);
  const go=()=>document.getElementById("listings")?.scrollIntoView({behavior:"smooth"});
  return html`<${React.Fragment}>
    <${Defs} />
    <div class="bar-progress" style=${{width:p+"%"}} aria-hidden="true"></div>
    <p class="ribbon">Design preview · pattayahomepro.com · not yet published</p>
    <${Nav} solid=${solid} onHome=${home} />
    ${view.n==="home" ? html`<${React.Fragment}>
        <${Hero} go=${go} /><${Listings} open=${open} /><${Segments} />
        <${LinkZone} open=${open} /><${Enquire} /></>`
    : html`<${Detail} p=${view.p} back=${home} open=${open} />`}
    <footer><div class="wrap foot">
      <span>© 2026 Pattaya Home Pro · Chonburi, Thailand</span>
      <span>Design preview — sample data, nothing connected</span>
    </div></footer>
  </>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
