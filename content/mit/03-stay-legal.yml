pages:

- path: /stay-legal/
  template: hub
  kicker: "Step 5 of 5: stay legal"
  title: "Staying Legal in Thailand: 90-Day Reports, TM30, Extensions & More"
  description: "Every report, form and deadline that keeps a foreign resident legal in Thailand: 90-day reports, TM30, yearly extensions, re-entry permits and overstays."
  h1: Stay legal, without the stress
  short: Stay legal
  verified: 2026-10-10
  lead: "Long-stay visas come with routine paperwork. None of it is hard, but the deadlines are strict and the fines are real. Here's every task, when it's due and how to do it."
  groups:
    - title: The regular tasks
      intro: "Put these dates in your calendar, or let [Residency Care](/residency-care/) track them for you."
      items: [/stay-legal/90-day-report/, /stay-legal/extension-of-stay/, /stay-legal/tm30/, /stay-legal/re-entry-permit/]
    - title: Useful documents and offices
      items: [/stay-legal/residence-certificate/, /stay-legal/pattaya-immigration-office/]
    - title: When something goes wrong
      items: [/stay-legal/overstay/]
  sections:
    - h2: Your year at a glance
      table:
        head: [Task, How often, Penalty if missed]
        rows:
          - ["[90-day report](/stay-legal/90-day-report/)", "Every 90 days of continuous stay", "2,000 THB fine; more if you're caught"]
          - ["[Extension of stay](/stay-legal/extension-of-stay/)", "Once a year", "You start overstaying the next day"]
          - ["[TM30 address report](/stay-legal/tm30/)", "Each time you move or return from abroad", "A fine for the landlord or for you; problems at your next extension"]
          - ["[Re-entry permit](/stay-legal/re-entry-permit/)", "Before every trip abroad", "Your extension is cancelled when you leave"]
  next: /residency-care/

- path: /stay-legal/90-day-report/
  kicker: Stay legal
  title: "Thailand 90-Day Report 2026: Online, In Person, Deadlines & Fines"
  description: "How to file Thailand's 90-day report online, by post or at immigration: the 15-day window, documents, the 2,000 THB fine for late reports, and who is exempt."
  h1: The 90-day report
  short: 90-day report
  card: "Due every 90 days of continuous stay. File online, in person or through an agent."
  verified: 2026-10-10
  for: Anyone staying in Thailand longer than 90 days in a row
  lead: "If you stay in Thailand for more than 90 days without leaving, you must confirm your address with immigration every 90 days. It's free, takes minutes, and is the most commonly missed deadline in Thailand."
  facts:
    - {v: Free, k: Cost}
    - {v: 15 days, k: "Window before the due date"}
    - {v: 7 days, k: "Grace after it"}
    - {v: "2,000 THB", k: Late fine}
  sections:
    - h2: When it's due
      p:
        - "The count starts on your arrival date, or on your last 90-day report. You can file from 15 days before the due date until 7 days after it. Leaving Thailand resets the count: your first report is due 90 days after you come back."
    - h2: Four ways to file
      table:
        head: [Method, How, Good for]
        rows:
          - [Online, "Immigration's online 90-day system, using your passport and address", "Second and later reports, once your first report is on file"]
          - [In person, "At your local immigration office with passport, TM.47 form and copies", "Your first report, or if the online system rejects you"]
          - [By post, "Registered mail with the TM.47 form and copies, sent early", People far from an office]
          - [Through someone else, "A representative with a signed authorisation", "Busy people, or our [Residency Care](/residency-care/) clients"]
    - h2: What to bring in person
      list:
        - "Passport, with copies of the photo page, current visa or extension, and latest entry stamp."
        - "Form TM.47, filled in and signed."
        - "Your previous 90-day receipt, if you have one."
        - "Your [TM30](/stay-legal/tm30/) receipt, which many offices check."
      note: "LTR visa holders report once a year instead. Thailand Privilege members can have reports handled through their membership."
  faq:
    - q: I'm going abroad before my report is due. Do I still file?
      a: "No. Leaving resets the 90-day count. Just get a [re-entry permit](/stay-legal/re-entry-permit/) if you hold an extension."
    - q: What if I'm late?
      a: "Go to immigration and pay the fine, 2,000 THB if you come in yourself. If you're stopped and found to be late, it is higher. It won't cost you your visa, but don't make it a habit."
  sources:
    - {label: Thai Immigration Bureau, url: "https://www.immigration.go.th/"}
  related: [/stay-legal/tm30/, /stay-legal/extension-of-stay/, /residency-care/]
  next: /stay-legal/extension-of-stay/

- path: /stay-legal/extension-of-stay/
  kicker: Stay legal
  title: "Thailand Visa Extension 2026: Yearly Extensions, Renewals & 30-Day Extensions"
  description: "How to extend your stay in Thailand: yearly extensions for retirement, marriage, family, business and education visas, plus 30-day tourist extensions. Fees, steps."
  h1: "Extensions of stay: renewing every year"
  short: Extensions and renewals
  card: "How yearly extensions work for retirement, marriage, business, family and student visas."
  verified: 2026-10-10
  for: Holders of Non-O, Non-B, Non-ED and tourist stays
  lead: "Most long-stay visas only get you in the door. What keeps you here is a yearly extension of stay at your local immigration office. Same office, same month, every year."
  facts:
    - {v: "1,900 THB", k: Fee per extension}
    - {v: 45 days, k: "Earliest you can apply (often 30)"}
    - {v: 1 year, k: Typical extension}
  sections:
    - h2: Which extension you need
      table:
        head: [Based on, Main test, Guide]
        rows:
          - [Retirement, "800,000 THB or 65,000 THB a month", "[Retirement visa](/visas/retirement/)"]
          - [Marriage to a Thai, "400,000 THB or 40,000 THB a month, plus a home visit", "[Marriage visa](/visas/marriage/)"]
          - [Thai child or dependant, "Relationship documents and support", "[Family visas](/visas/family/)"]
          - [Employment, "Work permit and company documents", "[Business visa](/visas/business/)"]
          - [Study, "School letter and attendance", "[Education visa](/visas/education/)"]
          - [Tourist or visa exemption, "One 30-day extension", "[Short stays](/visas/tourist-and-visa-exemption/)"]
    - h2: The yearly routine
      steps:
        - "Two months before: check the money rule or company documents are in order."
        - "One month before: book a slot if your office uses appointments, and gather documents."
        - "Apply with passport, TM.7 form, photo, fee, supporting documents and copies of every passport page you've used."
        - "Collect your 'under consideration' stamp if one is issued, then the full extension."
        - "Diary the next date, and your next [90-day report](/stay-legal/90-day-report/)."
      warn: "Never let the current extension lapse while you wait. If an application is refused, you usually get 7 days to leave. Apply early enough to fix problems."
  faq:
    - q: Do I need to leave Thailand to renew?
      a: "No. Extensions are done in Thailand at immigration, as long as you apply before the current permission ends."
    - q: Can I change from one type of extension to another?
      a: "Often, yes. For example, from marriage to retirement once you turn 50. Changes take more paperwork; plan them with us."
  related: [/stay-legal/90-day-report/, /stay-legal/re-entry-permit/, /stay-legal/pattaya-immigration-office/]
  next: /stay-legal/re-entry-permit/

- path: /stay-legal/tm30/
  kicker: Stay legal
  title: "TM30 Form Thailand 2026: Notification of Residence Explained"
  description: "The TM30 notification of residence: who files it (usually your landlord), the 24-hour deadline, how to file online, fines, and why you need the receipt."
  h1: "TM30: the address report"
  short: TM30 notification
  card: "Your landlord tells immigration where you live within 24 hours. Keep the receipt."
  verified: 2026-10-10
  for: Every foreigner staying at a Thai address, and their landlords
  lead: "The TM30 is how immigration knows where foreigners stay. The duty falls on the owner or manager of the place you stay, within 24 hours of your arrival. Hotels do it automatically; private landlords often forget."
  sections:
    - h2: Who must file, and when
      list:
        - "**The house owner, landlord or condo manager** files it within 24 hours of a foreigner arriving to stay."
        - "**You file it yourself** if you own the home you live in."
        - "It's needed again when you move, and in many offices after every return from abroad."
    - h2: Why you need the receipt
      p:
        - "Immigration offices increasingly ask for the TM30 receipt before they'll process an [extension](/stay-legal/extension-of-stay/), a [90-day report](/stay-legal/90-day-report/) or a [residence certificate](/stay-legal/residence-certificate/). No receipt, no service, even though the duty was your landlord's."
      note: "Ask for the TM30 receipt when you sign a lease. A good landlord or agent files it online the same day."
    - h2: How it's filed
      steps:
        - "Online, through immigration's TM30 system, after the owner registers once."
        - "In person at immigration, with the owner's ID, title deed or house book, your passport copy and the lease."
        - "The receipt slip is printed or downloaded. Keep a copy with your passport."
  faq:
    - q: My landlord won't file it. What now?
      a: "You can file it yourself at immigration with the lease and the owner's documents. If they refuse to provide them, it's a sign to find another landlord."
    - q: What's the fine?
      a: "Fines are charged to the person responsible, usually the landlord, and run into the low thousands of baht. The bigger cost is a delayed extension."
  related: [/stay-legal/90-day-report/, /homes/rent-in-pattaya/, /stay-legal/residence-certificate/]
  next: /stay-legal/residence-certificate/

- path: /stay-legal/re-entry-permit/
  kicker: Stay legal
  title: "Thailand Re-Entry Permit 2026: Single, Multiple, Cost & Where"
  description: "Why you need a re-entry permit before leaving Thailand on an extension of stay: single (1,000 THB) or multiple (3,800 THB), where to get one, and what happens without."
  h1: "Re-entry permits: don't lose your visa at the airport"
  short: Re-entry permit
  card: "Leaving Thailand on an extension? Without this permit, the extension ends at the border."
  verified: 2026-10-10
  for: Anyone on an extension of stay who travels abroad
  lead: "An extension of stay is cancelled the moment you leave Thailand, unless you have a re-entry permit. It's the cheapest insurance in Thai immigration, and the most painful to forget."
  facts:
    - {v: "1,000 THB", k: Single re-entry}
    - {v: "3,800 THB", k: Multiple re-entry}
  sections:
    - h2: Who needs one
      p:
        - "Anyone holding a yearly extension (retirement, marriage, family, business, education) or a single-entry visa they want to keep. Multiple-entry visas such as the DTV and Thailand Privilege don't need one for their own entries."
    - h2: Where to get it
      list:
        - "At your local immigration office, any time before you travel. Best for multiple-entry permits."
        - "At the airport immigration counter before departure (single entry). Allow extra time."
      steps:
        - "Fill in form TM.8, add a photo and passport copies."
        - "Pay the fee: 1,000 THB single, 3,800 THB multiple."
        - "The permit is stamped into your passport and lasts until your current extension ends."
  faq:
    - q: I forgot and already left. Is my visa gone?
      a: "Yes, the extension is cancelled. You'll need to re-enter on a new visa or exemption and start the process again. Call us before you fly back so we can plan the quickest route."
  related: [/stay-legal/extension-of-stay/, /stay-legal/90-day-report/, /visas/retirement/]
  next: /stay-legal/tm30/

- path: /stay-legal/residence-certificate/
  kicker: Stay legal
  title: "Thai Residence Certificate 2026: What It's For & How to Get One"
  description: "The certificate of residence from Thai immigration: why banks, the driving licence office and car dealers ask for it, the documents, and how long it takes."
  h1: The residence certificate
  short: Residence certificate
  card: "Immigration's letter confirming your address. Needed for a driving licence and more."
  verified: 2026-10-10
  for: Long-stay residents who need proof of address
  lead: "A residence certificate is a letter from immigration confirming where you live. You'll need one to get a Thai driving licence, register a car or motorbike, and sometimes to open a bank account or connect utilities."
  sections:
    - h2: What you'll need
      list:
        - "Passport, with copies of the photo page, visa, latest entry stamp and departure card or e-record."
        - "Your [TM30](/stay-legal/tm30/) receipt."
        - "Lease or title deed, and the owner's ID card copy if you rent."
        - "Two passport photos and the application form from the office."
    - h2: How long it takes
      p:
        - "Some offices issue it the same day; others take a few working days. A small fee applies. The certificate is usually accepted for 30 to 60 days, so get it just before you need it."
  related: [/living/driving-licence/, /living/bank-account/, /stay-legal/pattaya-immigration-office/]
  next: /living/driving-licence/

- path: /stay-legal/overstay/
  kicker: When things go wrong
  title: "Overstay in Thailand: Fines, Bans and What to Do Now"
  description: "Overstayed in Thailand? The 500 THB a day fine, the 20,000 THB cap, entry bans of 1 to 10 years, and how to leave with the least damage. Act before you're caught."
  h1: "Overstayed? What happens, and what to do"
  short: Overstay
  card: "500 THB a day, bans from 1 to 10 years. Turn yourself in before you're caught."
  verified: 2026-10-10
  for: Anyone who has stayed past their permitted date
  lead: "An overstay starts the day after your permission to stay ends. A day or two costs a fine at the airport. Longer overstays bring bans, and being caught is far worse than coming forward."
  facts:
    - {v: "500 THB", k: Fine per day}
    - {v: "20,000 THB", k: Maximum fine}
    - {v: "1-10 years", k: Possible ban}
  sections:
    - h2: Fines and bans
      table:
        head: [Situation, What usually happens]
        rows:
          - ["Overstay under 90 days, you leave voluntarily", "Fine of 500 THB a day, paid at departure. No ban."]
          - ["Over 90 days, you surrender", "Fine plus a 1-year ban (longer overstays: 3, 5 or 10 years)"]
          - ["Caught overstaying, under 1 year", "Arrest, detention, deportation and a 5-year ban"]
          - ["Caught overstaying, over 1 year", "Arrest, deportation and a 10-year ban"]
    - h2: What to do now
      steps:
        - "Don't travel around the country. Checkpoints are where most overstayers are caught."
        - "Book a flight out, and go to the airport early to pay the fine at immigration."
        - "If your overstay is long, talk to us or a lawyer first about surrendering at an immigration office."
      warn: "You can't extend or convert a visa while overstaying. The only safe step is to regularise by leaving or surrendering."
  related: [/stay-legal/extension-of-stay/, /visas/tourist-and-visa-exemption/, /stay-legal/pattaya-immigration-office/]
  next: /stay-legal/

- path: /stay-legal/pattaya-immigration-office/
  kicker: Office guide
  title: "Pattaya Immigration Office (Jomtien) 2026: Location, Hours & Tips"
  description: "The immigration office serving Pattaya, in Jomtien: where it is, opening hours, which services are handled there, what to bring and how to avoid the queues."
  h1: "The Pattaya immigration office, Jomtien"
  short: Pattaya immigration
  card: "Where it is, when it's open, and how to get through it quickly."
  verified: 2026-10-10
  for: Residents of Pattaya, Jomtien, Naklua and Banglamung
  lead: "Foreign residents of Pattaya are served by the Chonburi immigration office in Jomtien, on Soi 5 off Jomtien Beach Road. It handles extensions, 90-day reports, re-entry permits, TM30 and residence certificates."
  sections:
    - h2: The basics
      table:
        head: [What, Detail]
        rows:
          - [Location, "Jomtien Soi 5, off Jomtien Beach Road, Pattaya"]
          - [Hours, "Monday to Friday, about 8:30 to 16:30; closed weekends and public holidays"]
          - [Services, "Extensions, 90-day reports, re-entry permits, TM30, residence certificates, change of visa type"]
          - [Queues, "Longest on Mondays, after holidays and from November to March"]
    - h2: How to make it painless
      list:
        - "Arrive before opening for extensions; queue numbers can run out by late morning in high season."
        - "Bring copies of every passport page you've used, signed. Copy shops nearby charge a few baht a page."
        - "Dress respectfully: long trousers or a skirt, covered shoulders."
        - "Check whether the office is using appointments for your service; this changes."
      note: "Hours and procedures change. Confirm before you go, or let us prepare and accompany you."
  related: [/stay-legal/extension-of-stay/, /stay-legal/90-day-report/, /residency-care/]
  next: /stay-legal/
