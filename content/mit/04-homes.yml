- path: /homes/
  template: hub
  kicker: "Step 3 of 5: find your home"
  title: "Homes in Thailand for Foreigners: Rent or Buy in Pattaya (2026)"
  description: "Renting and buying a home in Thailand as a foreigner: how leases work, what you can legally own, the Land Office transfer, and homes for rent and sale in Pattaya."
  h1: "A home in Thailand: rent first, buy when you're sure"
  short: Homes
  verified: 2026-10-10
  lead: "Most people who move here happily rent for a year before buying. You'll learn the area, the building and the seasons. When you do buy, the law is clear about what a foreigner can own, and what is a trap."
  show_homes: true
  groups:
    - title: Renting
      items: [/homes/rent-in-pattaya/]
    - title: Buying
      intro: "Read these in order. They take you from the legal basics to the day you collect the keys."
      items: [/homes/foreign-ownership/, /homes/buy-condo-thailand/, /homes/property-transfer/, /tools/ownership-checker/]
  next: /living/moving-checklist/

- path: /homes/rent-in-pattaya/
  kicker: Homes guide
  title: "Renting in Pattaya 2026: Long-Term Rentals, Prices, Contracts & Deposits"
  description: "How long-term renting works in Pattaya and Jomtien: typical rents by area, deposits, lease terms, utilities, TM30, and how to avoid the common renting mistakes."
  h1: Renting a home in Pattaya
  short: Renting in Pattaya
  card: "Typical rents, deposits, contracts and the questions to ask before you sign."
  verified: 2026-10-10
  for: Anyone moving to Pattaya, Jomtien or the east side
  lead: "Pattaya has one of Thailand's deepest rental markets: thousands of condos, houses and pool villas, many furnished. Rents are lower than Bangkok or Phuket for the same space, and 12-month leases get the best prices."
  sections:
    - h2: What rent costs, by type
      table:
        head: [Home, Typical monthly rent (THB), Where]
        rows:
          - [Studio condo, "8,000 to 15,000", "Central Pattaya, Jomtien, Naklua"]
          - [1-bed condo, "12,000 to 25,000", "Most areas; sea views cost more"]
          - [2-bed condo, "25,000 to 50,000", "Jomtien, Pratumnak, Wongamat"]
          - [3-bed house with garden, "25,000 to 60,000", "East Pattaya, Huay Yai, Mabprachan"]
          - [Pool villa, "50,000 to 150,000+", "East Pattaya, Na Jomtien, Bang Saray"]
      after:
        - "Six-month leases cost 10 to 20% more. Short lets of one to three months cost more again, especially from November to March."
    - h2: What a normal lease looks like
      list:
        - "**Deposit:** two months' rent, refunded at the end minus damage. Plus the first month in advance."
        - "**Length:** 12 months is standard; 6 months is negotiable outside high season."
        - "**Utilities:** you pay electricity and water. In condos, check whether you're charged government rates or a building mark-up."
        - "**Included:** furniture, air conditioning, often internet in condos. Common-area fees are the owner's."
        - "**TM30:** the owner must file your [address report](/stay-legal/tm30/) within 24 hours. Ask for the receipt."
    - h2: Before you sign
      steps:
        - "View in the evening too: noise from bars, building sites and roads changes after dark."
        - "Photograph every room and existing damage, and attach the photos to the contract."
        - "Check the air conditioners were cleaned recently, the water pressure and the mobile signal."
        - "Get the contract in English and Thai, with the owner's ID and title deed copy."
        - "Agree in writing how and when the deposit is returned."
    - h2: Homes available now
      p:
        - "Our partner [Pattaya Home Pro](https://pattayahomepro.com/for-rent/) lists hundreds of rentals with prices and photos. We can arrange video viewings before you fly, and in-person viewings the week you land."
  faq:
    - q: Can I rent before I arrive?
      a: "Yes, by video viewing and a deposit. We recommend a short first lease, or a serviced apartment for the first month, then committing once you've seen the area."
    - q: Do agents charge tenants?
      a: "In Thailand the owner normally pays the agent's commission on a long lease. Be wary of anyone charging you a finder's fee for a standard rental."
  related: [/living/pattaya/, /homes/buy-condo-thailand/, /stay-legal/tm30/]
  next: /living/moving-checklist/

- path: /homes/foreign-ownership/
  kicker: Homes guide
  title: "What Foreigners Can Own in Thailand (2026): Condos, Houses, Land, Leases"
  description: "Clear rules on property ownership for foreigners in Thailand: condo freehold under the 49% quota, leasehold land, owning the house but not the land, and nominee risks."
  h1: What foreigners can own in Thailand
  short: What foreigners can own
  card: "Condo yes, land no, and the legal routes in between. Read this before any deposit."
  verified: 2026-10-10
  for: Anyone thinking about buying property in Thailand
  lead: "The rules are simpler than the sales pitches. A foreigner can own a condo unit outright. A foreigner cannot own land. Everything else is a legal structure around that line, and some structures are illegal."
  sections:
    - h2: The four options at a glance
      table:
        head: [Option, "Legal?", What you actually own]
        rows:
          - ["Condo in your own name", "Yes", "Freehold title to the unit, within the building's 49% foreign quota"]
          - ["House on leased land", "Yes", "The house itself, plus a registered lease of the land for up to 30 years"]
          - ["Property through a Thai spouse", "Yes", "Nothing: it is your spouse's. You sign that the money is theirs"]
          - ["Land through a Thai company with nominee shareholders", "No", "A criminal risk, and property that can be seized"]
    - h2: Condos
      p:
        - "Up to 49% of a building's sellable floor area can be owned by foreigners. Your money must come into Thailand from abroad in foreign currency; the bank's record of that transfer is what the Land Office checks. See [buying a condo](/homes/buy-condo-thailand/)."
    - h2: Houses and land
      p:
        - "You can own a building separately from the land under it. The usual route is to own the house and take a 30-year lease of the land, registered at the Land Office. Promises of 'automatic renewal' for a further 30 years are not reliably enforceable; price the deal on the first term."
        - "In 2025 the government discussed 99-year leases and a higher condo quota in some zones. As of our last check, neither is law. Don't pay a premium for a promise that depends on them."
    - h2: Companies and nominees
      warn: "A Thai company can own land only if Thai shareholders genuinely own the majority with their own money. Using Thais who just lend their names is a crime under the Foreign Business Act and the Land Code. Since January 2026 the authorities have tightened company registration and are investigating thousands of companies in property and tourism."
      after:
        - "There are lawful company routes for real businesses, such as BOI promotion. See [foreign business ownership](/business/foreign-ownership/)."
  faq:
    - q: Can my children inherit my condo?
      a: "Yes. A condo can pass to foreign heirs, subject to the quota and the inheritance process. Make a [Thai will](/living/wills-and-documents/) to keep it simple."
    - q: Does a long-stay visa change these rules?
      a: "No. Ownership rules are the same whatever your visa."
  related: [/homes/buy-condo-thailand/, /tools/ownership-checker/, /business/foreign-ownership/]
  next: /homes/buy-condo-thailand/

- path: /homes/buy-condo-thailand/
  kicker: Homes guide
  title: "Buying a Condo in Thailand as a Foreigner (2026): Step-by-Step Guide"
  description: "How to buy a condo in Thailand as a foreigner: foreign quota, transferring money from abroad, due diligence, deposits, contracts, transfer costs and timings."
  h1: Buying a condo, step by step
  short: Buying a condo
  card: "Quota, money transfer, due diligence, contract and transfer day, in order."
  verified: 2026-10-10
  for: Foreign buyers of new or resale condos
  lead: "Buying a condo in your own name is straightforward when you follow the steps in order. Most problems come from paying a deposit before the checks are done."
  facts:
    - {v: 49%, k: Foreign quota per building}
    - {v: "3-6%", k: Typical transfer costs}
    - {v: 4-8 weeks, k: Resale purchase time}
  sections:
    - h2: The steps
      steps:
        - "**Choose and check the unit.** Ask the building's juristic office whether foreign quota is available, and for the common-fee and sinking-fund figures."
        - "**Due diligence.** A lawyer checks the title deed (chanote), the seller's right to sell, debts on the unit, and the building's licences."
        - "**Reservation and contract.** Pay a small reservation, then sign a sale contract in English and Thai with clear deadlines and refund terms."
        - "**Send the money from abroad.** Transfer in foreign currency to a Thai account, stating it's for buying a condo. Ask the bank for the foreign-exchange certificate (FET) or credit advice."
        - "**Transfer at the Land Office.** Both sides or their representatives attend, pay the fees and taxes, and the title is registered in your name."
    - h2: What it costs to transfer
      table:
        head: [Cost, Rate, Usually paid by]
        rows:
          - [Transfer fee, "2% of the appraised value", "Split 50/50, or as agreed"]
          - [Specific business tax, "3.3%, if the seller owned it under 5 years", Seller]
          - [Stamp duty, "0.5%, when business tax doesn't apply", Seller]
          - [Withholding tax, "Varies with the seller and holding period", Seller]
      after:
        - "Everything is negotiable, so write who pays what in the contract. Off-plan buyers also pay into the building's sinking fund at transfer."
    - h2: New-build or resale?
      p:
        - "New-build (off-plan) units come with payment plans and developer warranties, but you're betting on completion and on the quota still being open. Resale units are what you see, with a history you can check. In Pattaya, resale units are often cheaper per square metre than new launches nearby."
  faq:
    - q: Can I get a mortgage?
      a: "Thai banks rarely lend to foreigners without Thai income. Most buyers pay cash, use developer payment plans, or borrow at home."
    - q: Do I need a lawyer?
      a: "You don't legally have to, but you should. Due diligence costs a small fraction of the price and is the one step you can't fix later."
  related: [/homes/property-transfer/, /homes/foreign-ownership/, /invest/]
  next: /homes/property-transfer/

- path: /homes/property-transfer/
  kicker: Homes guide
  title: "Property Transfer at the Land Office, Pattaya (2026): Fees, Taxes, Documents"
  description: "What happens on transfer day at the Banglamung Land Office: documents, title deed types and checks, transfer fees and taxes, and how to transfer through a representative."
  h1: Transfer day at the Land Office
  short: Land Office transfer
  card: "Documents, title deeds, fees and taxes for the day the property becomes yours."
  verified: 2026-10-10
  for: Buyers and sellers of property in Pattaya and Banglamung
  lead: "Ownership changes hands only when the transfer is registered at the Land Office. For Pattaya, that's the Banglamung Land Office. It's a half-day process when the paperwork is right."
  sections:
    - h2: Title deeds you'll meet
      table:
        head: [Deed, What it means]
        rows:
          - ["Chanote (Nor Sor 4 Jor)", "Full title, surveyed with GPS markers. The one you want."]
          - ["Nor Sor 3 Gor", "Confirmed use rights, surveyed. Can usually be sold and upgraded."]
          - ["Condo title (Or Chor 2)", "Title to a condo unit."]
          - ["Sor Kor 1, Por Bor Tor 5", "Possession or tax records, not ownership. Avoid."]
    - h2: What to bring
      list:
        - "Buyer: passport, and for condos, the bank's foreign-exchange record for the purchase money."
        - "Seller: original title deed, ID card and house registration, or company documents."
        - "For condos: the juristic office's letter confirming no unpaid fees, and the foreign-quota letter."
        - "If someone acts for you: a Land Office power of attorney form, signed and witnessed, with copies of your passport."
    - h2: Fees and taxes
      p:
        - "The Land Office calculates the transfer fee (2%) on its own appraised value, which can differ from your price. Taxes on the seller's side depend on how long they owned it and whether it's a company. The table in [buying a condo](/homes/buy-condo-thailand/) shows the usual split."
      note: "Pay at the Land Office by cashier's cheque or as the office directs. Never hand cash for 'fees' to anyone outside the official counters."
  related: [/homes/buy-condo-thailand/, /homes/foreign-ownership/, /living/wills-and-documents/]
  next: /living/moving-checklist/
