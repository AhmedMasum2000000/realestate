pages:

- path: /tools/
  template: hub
  kicker: Free tools
  title: "Thailand Relocation Tools: Visa Finder, Cost Calculator, Ownership Check"
  description: "Free tools for planning a move to Thailand: find your visa in two minutes, estimate your monthly budget, and check what property you can legally own as a foreigner."
  h1: Plan your move in five minutes
  short: Tools
  lead: "Three free tools that answer the first questions everyone asks. No sign-up, nothing stored."
  groups:
    - title: Start here
      items: [/tools/visa-finder/, /tools/cost-calculator/, /tools/ownership-checker/]
  next: /tools/visa-finder/

- path: /tools/visa-finder/
  template: tool
  tool: visa
  kicker: Visa Finder
  title: "Thailand Visa Finder: Which Visa Fits You? (Free, 2 Minutes)"
  description: "Answer five questions about your age, reason for moving, savings and income, and get a shortlist of the Thailand visas you are likely to qualify for, with next steps."
  h1: Which Thai visa fits you?
  short: Visa Finder
  card: "Five questions, two minutes, a shortlist of routes that fit your situation."
  lead: "Five questions. Your answers stay in your browser. You'll get a shortlist with links to the full guide for each route."
  sections:
    - h2: How the shortlist is made
      p:
        - "Each route has a few hard tests: age for the retirement visa, savings for the DTV, income for the LTR, family ties for the marriage and family visas. The finder checks your answers against those tests. It can't see the details that sometimes change the answer, such as your nationality or the embassy you'll use. A 15-minute call settles those."
  next: /visas/

- path: /tools/cost-calculator/
  template: tool
  tool: cost
  kicker: Cost calculator
  title: "Thailand Cost of Living Calculator 2026: Your Monthly Budget"
  description: "Estimate your monthly cost of living in Thailand by city, household size, type of home and lifestyle. Line-by-line figures in Thai baht for Pattaya, Bangkok and more."
  h1: What will your month cost?
  short: Cost calculator
  card: "Pick a city, household, home and lifestyle. See the monthly total, line by line."
  lead: "Change the options and the total updates. Figures are 2026 estimates in Thai baht, based on what our clients typically pay."
  sections:
    - h2: Reading the result
      p:
        - "Rent and lifestyle move the total most. Add 10% for your first months, when you're buying the basics. For the reasoning behind each line, read [the cost of living guide](/living/cost-of-living/)."
  next: /living/cost-of-living/

- path: /tools/ownership-checker/
  template: tool
  tool: own
  kicker: Ownership checker
  title: "Can Foreigners Buy Property in Thailand? Free Ownership Checker"
  description: "Check what a foreigner can legally own in Thailand: condo, house, land or business premises, in your name, a Thai spouse's or a company's, with funds from abroad or not."
  h1: Can you own it?
  short: Ownership checker
  card: "Three questions about what, whose name and where the money comes from."
  lead: "Three questions about the property you have in mind. You'll get the legal route, and the traps to avoid."
  sections:
    - h2: Before you pay a deposit
      p:
        - "Whatever the answer, have a licensed lawyer check the title deed and the contract. Read [what foreigners can own](/homes/foreign-ownership/) for the full rules."
  next: /homes/foreign-ownership/
