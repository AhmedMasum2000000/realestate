- path: /living/pattaya/
  kicker: Area guide
  title: "Where to Live in Pattaya (2026): Neighbourhoods Compared for Expats"
  description: "Pattaya's neighbourhoods compared for people moving there: Jomtien, Pratumnak, Naklua and Wongamat, Central, East Pattaya, Na Jomtien and Bang Saray. Who each suits."
  h1: Where to live in Pattaya
  short: Living in Pattaya
  card: "Jomtien, Pratumnak, Naklua, East Pattaya and more, compared for daily life."
  verified: 2026-10-10
  for: Anyone choosing an area in or around Pattaya
  lead: "Pattaya is several towns in one. The nightlife strip most visitors see is a small part of it. Families, retirees and remote workers mostly live in quieter areas a few minutes away, and each has a distinct character."
  sections:
    - h2: The areas side by side
      table:
        head: [Area, Feels like, Best for, Homes]
        rows:
          - [Jomtien, "Long beach, relaxed, lots of long-stay residents", "Retirees, couples, first-timers", "Condos of every age; good-value rentals"]
          - [Pratumnak, "Green hill between Pattaya and Jomtien, quiet", "People who want calm near the centre", "Mid to high-end condos, a few villas"]
          - ["Naklua and Wongamat", "Northern beaches, more upmarket", "Families and buyers wanting new builds", "High-rise condos, sea views"]
          - [Central Pattaya, "Busy, walkable, everything open late", "Short stays and people who want the action", "Older condos and serviced apartments"]
          - [East Pattaya, "Green, spacious, villages and lakes", "Families with pets, people who want a garden", "Houses and pool villas in gated estates"]
          - [Na Jomtien, "Beachfront south of Jomtien, quieter", "Long stays near the sea", "Resort-style condos"]
          - [Bang Saray, "Fishing village 25 minutes south", "People who want Thai village life", "Villas and low-rise condos"]
    - h2: What to check before choosing
      list:
        - "**Schools:** most international schools are in East Pattaya and towards Sattahip; check the morning drive."
        - "**Hospitals:** the main private hospitals are in Central and North Pattaya; 15 minutes matters in an emergency."
        - "**Flooding:** some low-lying sois flood in heavy rain. Ask neighbours, not agents."
        - "**Noise:** building sites and bars change a street quickly. Visit at night."
      note: "Compare real listings by area on [Pattaya Home Pro](https://pattayahomepro.com/areas/jomtien/), our property partner."
  related: [/homes/rent-in-pattaya/, /living/cost-of-living/, /living/getting-around-pattaya/]
  next: /living/cost-of-living/

- path: /living/cost-of-living/
  kicker: Money guide
  title: "Cost of Living in Thailand 2026: Real Monthly Budgets for Expats"
  description: "What it really costs to live in Thailand in 2026: monthly budgets for singles, couples and families in Pattaya, Bangkok, Phuket, Chiang Mai and Hua Hin, line by line."
  h1: What it really costs to live in Thailand
  short: Cost of living
  card: "Monthly budgets for singles, couples and families, line by line, by city."
  verified: 2026-10-10
  for: Anyone budgeting a move
  lead: "Thailand can be very affordable or surprisingly expensive. Three things decide it: rent, imported food and drink, and private schooling. Everything else is cheaper than in most Western countries."
  sections:
    - h2: Typical monthly budgets in Pattaya
      table:
        head: [Household, Simple, Comfortable, Premium]
        rows:
          - [Single, "35,000 THB", "55,000 THB", "100,000+ THB"]
          - [Couple, "50,000 THB", "80,000 THB", "150,000+ THB"]
          - [Family of four, "90,000 THB", "150,000 THB", "250,000+ THB"]
      after:
        - "Simple means a 1-bed condo, cooking at home and baht buses. Comfortable means a 2-bed condo, eating out often and your own scooter. Premium means a house or sea-view condo, a car and imported food. Bangkok and Phuket run about 25 to 30% higher; Chiang Mai about 20% lower."
    - h2: The line items
      table:
        head: [Item, Typical cost (THB a month)]
        rows:
          - [Rent, "See [renting in Pattaya](/homes/rent-in-pattaya/): 12,000 to 50,000 for most condos"]
          - [Electricity, "1,500 to 6,000; air conditioning is the big variable"]
          - [Water and internet, "800 to 1,500"]
          - [Phone plan, "300 to 800"]
          - [Thai food, "80 to 150 a meal at local places"]
          - [Western food, "300 to 800 a meal"]
          - [Health insurance, "3,000 to 15,000 per adult, rising with age"]
          - [International school, "From 30,000 per child, often far more"]
    - h2: Build your own number
      p:
        - "Use the [cost calculator](/tools/cost-calculator/) for your city, household and lifestyle. Then add a buffer of 10%: the first months always cost more while you buy the things a furnished rental doesn't include."
  related: [/tools/cost-calculator/, /living/health-insurance/, /homes/rent-in-pattaya/]
  next: /homes/

- path: /living/moving-checklist/
  kicker: "Step 4 of 5: land and set up"
  title: "Moving to Thailand Checklist (2026): Before You Fly & First 30 Days"
  description: "The complete moving-to-Thailand checklist: documents to bring, what to do in your first week, the first 30 days, and the yearly tasks that keep you legal."
  h1: The moving checklist
  short: Moving checklist
  card: "Documents to pack, the first week and the first 30 days, in order."
  verified: 2026-10-10
  for: Anyone with a moving date
  lead: "Print this. Tick it off. Each line links to the guide that explains it."
  sections:
    - h2: Before you fly
      list:
        - "Visa approved and printed. See [visas](/visas/)."
        - "Passport valid for 18+ months, with blank pages."
        - "Bank statements, pension or salary proof, and copies."
        - "Marriage and birth certificates, legalised if needed: [documents](/living/wills-and-documents/)."
        - "Driving licence plus an International Driving Permit."
        - "[Health insurance](/living/health-insurance/) active from day one."
        - "First month's accommodation booked, and viewings arranged: [renting](/homes/rent-in-pattaya/)."
    - h2: First week
      list:
        - "Thai SIM card, at the airport or a phone shop, with your passport."
        - "Move in, inspect and photograph the home, collect keys and the contract."
        - "Landlord files your [TM30](/stay-legal/tm30/). Get the receipt."
        - "Download Bolt or Grab for transport and food, and learn the [baht bus routes](/living/getting-around-pattaya/)."
    - h2: First 30 days
      list:
        - "Open a [bank account](/living/bank-account/)."
        - "Get a [residence certificate](/stay-legal/residence-certificate/), then a [Thai driving licence](/living/driving-licence/)."
        - "Register with a hospital and a dentist; keep your insurance card in your wallet."
        - "Put your [90-day report](/stay-legal/90-day-report/) and [extension](/stay-legal/extension-of-stay/) dates in your calendar."
    - h2: Every year
      list:
        - "Extension of stay, and the money test that goes with it."
        - "90-day reports, unless your visa replaces them."
        - "Re-entry permit before every trip abroad: [re-entry permits](/stay-legal/re-entry-permit/)."
        - "Driving licence renewal when it's due."
  related: [/start-here/, /living/bank-account/, /residency-care/]
  next: /stay-legal/

- path: /living/driving-licence/
  kicker: Daily life
  title: "Thai Driving Licence for Foreigners 2026: Convert, New, Renew (Pattaya)"
  description: "Get a Thai driving licence as a foreigner: convert a foreign licence or IDP, sit the test, renew from 2 to 5 years, car and motorbike, at the Banglamung DLT."
  h1: Getting a Thai driving licence
  short: Driving licence
  card: "Convert your licence, sit the test, or renew: car and motorbike, all in one guide."
  verified: 2026-10-10
  for: Residents who drive a car or ride a motorbike
  lead: "If you live here, get a Thai licence. An International Driving Permit only covers short stays, and insurers can refuse claims from residents without a Thai licence. For Pattaya, the office is the Department of Land Transport in Banglamung."
  sections:
    - h2: Three ways to get one
      table:
        head: [Your situation, What you do]
        rows:
          - ["You hold a valid licence from home, or an IDP", "Convert it: colour, reaction and depth tests, a short training video, no driving test in most cases"]
          - ["You have no licence for that vehicle", "Online or classroom training, a written test, then a practical test. A [driving school](#driving-schools) helps"]
          - ["You already have a Thai licence", "Renew it: the first licence lasts 2 years, renewals 5 years"]
    - h2: Documents you'll need
      list:
        - "Passport with your visa and latest entry stamp. Most offices want a non-immigrant visa or extension; some convert for visa-exempt visitors with proof of address."
        - "A [residence certificate](/stay-legal/residence-certificate/) from immigration, or your work permit."
        - "A medical certificate from a clinic, issued within the last month (a few hundred baht)."
        - "Your foreign licence or IDP, and a certified translation if it isn't in English."
    - h2: The day itself
      steps:
        - "Book a queue slot through the DLT's online booking system or at the office."
        - "Hand in documents and copies, then sit the colour-blindness, reaction (brake) and depth-perception tests."
        - "Watch the road-safety training video, or complete it online in advance."
        - "Take the written and practical tests, if you're not converting."
        - "Pay the small fee, have your photo taken and collect the card the same day."
      note: "Do car and motorbike on the same visit; the tests are shared."
    - h2: Driving schools
      p:
        - "If you've never ridden a motorbike or driven on the left, a few lessons at a licensed driving school are worth it. Many in Pattaya teach in English and can arrange the test at their own track, which DLT accepts."
  faq:
    - q: Can I ride a rented scooter on my car licence?
      a: "Legally, no: motorbikes need a motorbike category. Police checkpoints fine riders without the right licence, and travel insurance usually won't pay."
    - q: How do I renew from 2 years to 5 years?
      a: "Before expiry, bring the same documents plus your current card, do the tests and a short training session, and you'll get a 5-year licence."
  related: [/stay-legal/residence-certificate/, /living/getting-around-pattaya/, /living/health-insurance/]
  next: /living/bank-account/

- path: /living/bank-account/
  kicker: Daily life
  title: "Opening a Thai Bank Account as a Foreigner (2026): Banks & Documents"
  description: "How foreigners open a Thai bank account: which banks to try, the documents they ask for, visa requirements, mobile banking, and using it for visa money proof."
  h1: Opening a Thai bank account
  short: Bank account
  card: "Which visa you need, which banks to try, and the documents to bring."
  verified: 2026-10-10
  for: Anyone living in Thailand, and anyone on a retirement or marriage route
  lead: "You need a Thai bank account to pay rent, to avoid 220 THB fees on every foreign-card withdrawal, and, for retirement and marriage extensions, to hold the money immigration checks. Banks are cautious with foreigners, so bring more paperwork than you think."
  sections:
    - h2: What banks usually ask for
      list:
        - "Passport with a non-immigrant visa or extension. Accounts on a visa-exempt stay are increasingly refused."
        - "Proof of address: a [residence certificate](/stay-legal/residence-certificate/), lease or utility bill."
        - "A Thai phone number in your name."
        - "Sometimes a work permit, a letter from your embassy, or a reference from a Thai account holder."
    - h2: Which banks
      p:
        - "Bangkok Bank, Kasikorn (KBank), SCB and Krungsri are the most used by foreigners in Pattaya. Policies differ from branch to branch, so if one branch says no, another may say yes. Branches in shopping malls open at weekends."
    - h2: Once it's open
      list:
        - "Set up the mobile banking app; Thai QR payments (PromptPay) are accepted almost everywhere."
        - "Keep the bank book updated: immigration reads it for retirement and marriage extensions."
        - "For property purchases, ask how the bank issues the foreign-exchange record before you send money."
  related: [/visas/retirement/, /homes/buy-condo-thailand/, /living/moving-checklist/]
  next: /living/driving-licence/

- path: /living/health-insurance/
  kicker: Daily life
  title: "Health Insurance in Thailand for Expats (2026): Costs, Visas & Cover"
  description: "Health insurance for foreigners in Thailand: Thai vs international policies, premiums by age, visas that require cover, pre-existing conditions, car insurance."
  h1: Health insurance for life in Thailand
  short: Health insurance
  card: "Thai or international, costs by age, and which visas require it."
  verified: 2026-10-10
  for: Everyone moving here, especially over 50
  lead: "Private hospitals in Thailand are excellent, and they bill like it. Good cover protects your savings, and several visas (the Non-O-A, the LTR) require it. Buy before you're older: many insurers stop accepting new customers somewhere around 70 to 75."
  sections:
    - h2: Thai or international policy?
      table:
        head: ["", Thai insurer, International insurer]
        rows:
          - [Premium, Lower, Higher]
          - [Cover outside Thailand, "Usually none, or limited", "Regional or worldwide"]
          - [Age limits for new policies, "Often around 70", "Some accept older applicants"]
          - [Visa certificates, "Usually issued in the format immigration expects", "Check that the certificate meets the visa wording"]
    - h2: What it costs
      p:
        - "Inpatient-only cover from a Thai insurer starts at a few thousand baht a month for people in their 30s and 40s and rises steeply after 60. International comprehensive plans can cost several times more. Deductibles cut premiums a lot."
    - h2: Read the small print
      list:
        - "Pre-existing conditions are excluded or loaded, often for two years or permanently."
        - "Outpatient cover is usually an add-on."
        - "Accidents on a motorbike without the right [licence](/living/driving-licence/) may not be covered."
    - h2: Car and motorbike insurance
      p:
        - "Every vehicle needs compulsory third-party insurance (Por Ror Bor), renewed with the road tax. It covers very little. Add voluntary cover: Class 1 is comprehensive; Class 2+ and 3+ are cheaper middle options."
  related: [/visas/retirement/, /visas/ltr/, /living/cost-of-living/]
  next: /living/getting-around-pattaya/

- path: /living/getting-around-pattaya/
  kicker: Daily life
  title: "Getting Around Pattaya (2026): Baht Buses, Taxis, Airports, Car & Bike Hire"
  description: "How to get around Pattaya: baht bus routes and fares, ride apps, airport transfers to Suvarnabhumi and U-Tapao, renting a car or motorbike safely, and what it costs."
  h1: Getting around Pattaya
  short: Getting around
  card: "Baht buses, ride apps, airport transfers and renting a car or bike safely."
  verified: 2026-10-10
  for: New arrivals and residents without a car
  lead: "You can live well in Pattaya without a car. Baht buses run the main roads, ride apps cover the rest, and both airports are an easy transfer away."
  sections:
    - h2: Everyday options
      table:
        head: [Option, Typical cost, Good to know]
        rows:
          - ["Baht bus (songthaew)", "10 to 20 THB a ride on fixed routes", "Hop on, press the buzzer to stop, pay the driver. Agree a price first if you hire one privately"]
          - [Bolt and Grab, "60 to 200 THB across town", "Price shown upfront; cars and motorbike taxis"]
          - [Motorbike taxi, "30 to 100 THB", "Drivers wear numbered vests; helmets required"]
          - ["Car or scooter rental", "Scooter from about 3,000 THB a month; car from about 15,000 THB", "Licence and insurance matter: see below"]
    - h2: Airports
      list:
        - "**Suvarnabhumi (Bangkok):** about 1.5 to 2 hours. Private transfers from about 1,200 to 1,800 THB; buses run to Jomtien and North Pattaya."
        - "**U-Tapao:** about 45 minutes south, with regional flights."
        - "**Don Mueang (Bangkok):** about 2.5 hours, for budget airlines."
    - h2: Renting a car or motorbike safely
      list:
        - "Ride or drive only with the right [licence](/living/driving-licence/). Without it, insurance won't pay."
        - "Wear a helmet; it's the law and the checkpoints enforce it."
        - "Photograph the vehicle before you take it, and read what the insurance excludes."
        - "Never leave your passport as a deposit. Offer a cash deposit or a copy instead."
  related: [/living/driving-licence/, /living/pattaya/, /living/home-services/]
  next: /living/home-services/

- path: /living/home-services/
  kicker: Daily life
  title: "Home Services in Pattaya (2026): Cleaning, Repairs, Air Con & Utilities"
  description: "Running a home in Pattaya: what cleaners, air-con servicing and repairs cost, paying electricity and water, setting up internet, and dealing with condo management."
  h1: Running your home in Pattaya
  short: Home services
  card: "Cleaners, air-con servicing, repairs, utilities and internet: who, how and how much."
  verified: 2026-10-10
  for: Renters and owners setting up a home
  lead: "The little things keep a home running in the tropics: air conditioners serviced, a reliable cleaner, a plumber who turns up. Here's what's normal and what it costs."
  sections:
    - h2: What things cost
      table:
        head: [Service, Typical price (THB)]
        rows:
          - [Cleaner, "300 to 500 an hour, or 1,000 to 2,000 for a condo deep clean"]
          - [Air-con service, "500 to 800 per unit; every 3 to 6 months"]
          - [Plumber or electrician call-out, "500 to 1,500 plus parts"]
          - [Pest control, "1,500 to 3,000 a visit, or a yearly contract"]
          - [Fibre internet, "500 to 1,000 a month"]
    - h2: Utilities
      list:
        - "Electricity is billed by PEA in houses, often by the building in condos. Ask which rate you pay."
        - "Water is cheap; bills of a few hundred baht are normal."
        - "Internet: AIS, True and 3BB all install within days. Bring your passport and lease."
        - "Pay at 7-Eleven, by bank app or by direct debit."
    - h2: Repairs in a rental
      p:
        - "Your landlord pays for wear and breakdowns; you pay for damage. Report problems in writing, with photos, the day they happen. In condos, the building's juristic office handles common areas and can recommend tradespeople."
  related: [/homes/rent-in-pattaya/, /living/cost-of-living/, /residency-care/]
  next: /living/wills-and-documents/

- path: /living/wills-and-documents/
  kicker: Legal and documents
  title: "Thai Wills, Translations & Legalisation for Foreigners (2026)"
  description: "Making a Thai will for property and bank accounts, certified translation and legalisation of documents, registering a marriage, and finding a licensed lawyer in Pattaya."
  h1: "Wills, translations and legal paperwork"
  short: Wills and documents
  card: "A Thai will, certified translations, legalisation and finding a licensed lawyer."
  verified: 2026-10-10
  for: Residents with assets here, and anyone using foreign documents in Thailand
  lead: "Two kinds of paperwork catch foreign residents out: a missing will, which leaves family facing months in a Thai court, and foreign documents that Thai offices won't accept until they're translated and legalised."
  sections:
    - h2: A Thai will
      p:
        - "If you own a condo, a car or a bank account here, make a Thai will for your Thai assets. It's simple: written (in Thai, or bilingual), signed in front of two witnesses who don't benefit, and naming an executor. Without one, your heirs need a court order, which takes months and a lawyer's fees, before a bank or the Land Office will act."
      note: "Keep your home-country will for your other assets and make sure the two don't contradict each other. A lawyer drafts both in one conversation."
    - h2: Translation and legalisation
      steps:
        - "Get the original document (birth, marriage, divorce or degree certificate) and have it certified in the country that issued it."
        - "Have it legalised by that country's embassy in Thailand, or apostilled at home where accepted."
        - "Get a certified Thai translation."
        - "Have the translation legalised at the Ministry of Foreign Affairs' Department of Consular Affairs."
      after:
        - "This chain is needed for marriage registration, family visas, some bank and land office steps, and school enrolment."
    - h2: Finding a lawyer
      list:
        - "Ask for the lawyer's licence from the Lawyers Council of Thailand, and check it."
        - "Get the scope and the fee in writing before work starts."
        - "Be wary of anyone offering to make illegal structures 'work'. That advice costs more than the fee."
  related: [/visas/marriage/, /homes/foreign-ownership/, /business/foreign-ownership/]
  next: /stay-legal/
